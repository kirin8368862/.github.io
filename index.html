/* ─── 動畫 ─── */

@keyframes slide-up { 0%{transform:translateY(30px);opacity:0} 100%{transform:translateY(0);opacity:1} }
@keyframes pulse-gentle { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

.animate-float { animation: float 3s ease-in-out infinite; }
.animate-float2 { animation: float2 3.5s ease-in-out infinite; }

.animate-wiggle { animation: wiggle 0.4s ease infinite; }
.animate-star-pop { animation: star-pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }

/* ─── 糖果按鈕 ─── */
.candy-btn {

// ══════════════════════════════════════════════
// 音效引擎
// ══════════════════════════════════════════════
const AudioEngine = (function(){
  let ctx=null, unlocked=false;
  function init(){
    try{
      if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C();}
      if(ctx&&ctx.state==='suspended')ctx.resume();
      if(ctx&&!unlocked){const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);unlocked=true;}
    }catch(e){}
  }
  function tone(freq,type,dur,vol=0.3){
    try{if(!ctx)return;const t=ctx.currentTime;const o=ctx.createOscillator();const g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur);}catch(e){}
  }
  return {
    init,
    play(type){
      init();
      if(type==='correct'){tone(659,'sine',0.12,0.4);setTimeout(()=>tone(880,'sine',0.12,0.4),100);setTimeout(()=>tone(1047,'sine',0.3,0.5),200);}
      else if(type==='incorrect'){tone(300,'sawtooth',0.15,0.35);setTimeout(()=>tone(220,'sawtooth',0.25,0.4),150);}
      else if(type==='clear'){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.15,0.4),i*80));setTimeout(()=>{tone(1047,'sine',0.6,0.6);tone(784,'sine',0.6,0.6);},420);}
      else if(type==='fail'){tone(392,'triangle',0.2,0.35);setTimeout(()=>tone(330,'triangle',0.4,0.4),200);}
      else if(type==='ding'){tone(1047,'sine',0.1,0.3);setTimeout(()=>tone(1319,'sine',0.1,0.25),100);}
    }
  };
})();

// ══════════════════════════════════════════════
// 口說辨識 (中等容錯)
// ══════════════════════════════════════════════
const getLev=(a,b)=>{
  const dp=Array.from({length:b.length+1},(_,i)=>[i]);
  for(let j=0;j<=a.length;j++)dp[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)dp[i][j]=b[i-1]===a[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i][j-1],dp[i-1][j]);
  return dp[b.length][a.length];
};
const SOUND={'ph':'f','ck':'k','gh':'g','kn':'n','wr':'r','mb':'m','wh':'w','qu':'kw'};
const normS=(s)=>{let r=s.toLowerCase().trim();Object.entries(SOUND).forEach(([f,t])=>{r=r.replaceAll(f,t);});return r;};
const isFuzzy=(spoken,target)=>{
  const DM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","13":"thirteen","14":"fourteen","15":"fifteen","16":"sixteen","17":"seventeen","18":"eighteen","19":"nineteen","20":"twenty","30":"thirty","40":"forty","50":"fifty","60":"sixty","70":"seventy","80":"eighty","90":"ninety"};
  let cs=spoken.toLowerCase().replace(/[^a-z0-9 ]/g,'');
  const ct=target.toLowerCase().replace(/[^a-z ]/g,'').trim();
  const nt=normS(ct);
  const words=cs.split(/\s+/).map(w=>DM[w]||w);
  cs=words.join(' ');
  if(cs.includes(ct)||cs.includes(nt))return true;
  for(let w of words){
    if(!w)continue;
    const nw=normS(w);
    if(w===ct||nw===nt)return true;
    const len=ct.length;
    const thr=len<=3?1:len<=5?1:len<=7?2:len<=10?3:4;
    if(Math.min(getLev(w,ct),getLev(nw,nt))<=thr)return true;
    if(ct.length>=6){const plen=Math.ceil(ct.length*0.65);if(w.startsWith(ct.slice(0,plen))||ct.startsWith(w.slice(0,plen))&&w.length>=plen-1)return true;}
  }
  return cs.replace(/\s/g,'').includes(ct);
};

// 彩帶特效
// ══════════════════════════════════════════════
function Confetti(){
  const colors=['#ff8fab','#a2d2ff','#ffda77','#cdb4db','#caffbf','#ffc8dd','#bde0fe'];
  const pieces = Array.from({length:60},(_,i)=>({
    id:i, color:colors[i%colors.length],
    left:`${Math.random()*100}vw`,
    delay:`${Math.random()*1.5}s`,
    dur:`${2+Math.random()*2}s`,
    size:`${6+Math.random()*10}px`,
    shape: Math.random()>0.5?'50%':'4px',
  }));
  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:999,overflow:'hidden'}}>
      {pieces.map(p=>(
        <div key={p.id} className="confetti-piece" style={{
          left:p.left, backgroundColor:p.color,

}

// 依當天單字動態替換題目中的填空詞
function buildSentenceQuestions(wordPool) {
  const shuffle=(a)=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const animals=wordPool.filter(w=>['cat','dog','bird','fish','rabbit','hamster','horse','monkey','elephant','tiger','lion','bear','duck','pig','goat','sheep','turtle','snake','frog'].includes(w.en));
  const adjectives=wordPool.filter(w=>['happy','sad','big','small','tall','short','hot','cold','fast','slow','clean','dirty','beautiful','ugly','funny','tired','hungry','angry','brave','cute','smart'].includes(w.en));
  const verbs=wordPool.filter(w=>['run','swim','jump','sing','dance','draw','read','write','play','cook','eat','drink','sleep','study','walk','ride','fly','laugh','cry'].includes(w.en));
  const foods=wordPool.filter(w=>['apple','banana','bread','cake','rice','egg','milk','juice','pizza','sandwich','noodle','soup','salad','cookie','chocolate','ice','dumpling'].includes(w.en));
  const vehicles=wordPool.filter(w=>['car','bus','train','bicycle','motorcycle','airplane','ship','taxi'].includes(w.en));
  const things=wordPool.filter(w=>['book','pen','ball','bag','key','hat','cup','phone','computer','clock','desk','chair','door','window'].includes(w.en));

  const pick=(arr)=>arr.length?arr[Math.floor(Math.random()*arr.length)]:null;

  const selected = shuffle(SENTENCE_TEMPLATES).slice(0,6);
  return selected.map(tpl=>{
    if(tpl.type==='fill_blank'){
      let word=null;
      if(tpl.word_tag==='animal_pet') word=pick(animals)||pick(wordPool);
      else if(tpl.word_tag==='adj') word=pick(adjectives)||pick(wordPool);
      else if(tpl.word_tag==='verb_activity') word=pick(verbs)||pick(wordPool);
      else if(tpl.word_tag==='food') word=pick(foods)||pick(wordPool);
      else if(tpl.word_tag==='vehicle') word=pick(vehicles)||pick(wordPool);
      else word=pick(things)||pick(wordPool);
      if(!word) word={en:'cat',zh:'貓'};
      return {
        type:'fill_blank',
        sentence:tpl.template.replace('___',`___`),
        blank_word:word.en, blank_word_zh:word.zh,
        hint:`中文：「${word.zh}」`,
        translation:tpl.zh_template.replace('___',`(${word.zh})`),
        grammar_tip:tpl.grammar_tip,
      };
    } else if(tpl.type==='choice'){
      return { type:'choice', ...tpl };
    } else {
      return { type:'arrange', words:shuffle(tpl.words_template), answer:tpl.answer_template, translation:tpl.translation, grammar_tip:tpl.grammar_tip };
    }
  });
}

// 工具

const shuffle=(a)=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
const fmtDate=(d)=>{const dt=new Date(d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
const weekDiff=(s,t)=>{const sd=new Date(s);sd.setHours(0,0,0,0);const sD=sd.getDay()||7;sd.setDate(sd.getDate()-sD+1);const td=new Date(t);td.setHours(0,0,0,0);const tD=td.getDay()||7;td.setDate(td.getDate()-tD+1);return Math.max(0,Math.round((td-sd)/(86400000*7)));};
const getRec=(rec,mode)=>{if(!rec||rec[mode]===undefined)return null;if(typeof rec[mode]==='number')return{correct:rec[mode]/10,total:rec[mode]/10};return rec[mode];};
const MODES=['listening','dictation','speaking','dictation-en','sentence'];
const dayScore=(rec)=>{if(!rec)return 0;let tc=0,tq=0,cc=0;MODES.forEach(m=>{const r=getRec(rec,m);if(r){tc+=r.correct;tq+=r.total;cc++;}});if(!tq)return 0;return Math.round((tc/tq)*(cc*20));};

  const [isFirstPass, setIsFirstPass]=useState(true);

  const [notif, setNotif]=useState('');

  const [opts, setOpts]=useState([]);

  const [rtText, setRtText]=useState('');

  const [spkErr, setSpkErr]=useState(false);
  // 角色彈窗

  const [sqScore, setSqScore]=useState(0);
  const [sqFb, setSqFb]=useState(null);
  const [fillInp, setFillInp]=useState('');
  const [arrWords, setArrWords]=useState([]);
  const [arrAns, setArrAns]=useState([]);

  const recRef=useRef(null);
  const tmRef=useRef(null);
  const heardRef=useRef('');

  useEffect(()=>{const u=()=>{AudioEngine.init();};document.addEventListener('click',u,{once:true});document.addEventListener('touchstart',u,{once:true});return()=>{document.removeEventListener('click',u);document.removeEventListener('touchstart',u);};},[]);
  useEffect(()=>{return()=>{if(tmRef.current)clearTimeout(tmRef.current);if(recRef.current)recRef.current.stop();};},[]);

  useEffect(()=>{
    const sl=localStorage.getItem('wm_level')||'elementary';
    setLv(sl);
    const sfx=sl==='junior'?'_j':'';
    const ss=localStorage.getItem('wm_start'+sfx);
    const sr=localStorage.getItem('wm_rec'+sfx);
    const sv=localStorage.getItem('wm_vocab'+sfx);
    const vs=sl==='junior'?JUNIOR:ELEM;
    const pv=vs.split(',').map(p=>{const[en,zh]=p.split(':');return{en,zh};});
    if(sv)setVocab(JSON.parse(sv));
    else{const s=shuffle(pv);setVocab(s);localStorage.setItem('wm_vocab'+sfx,JSON.stringify(s));}
    if(sr)setRecords(JSON.parse(sr));
    if(ss&&ss!=='undefined'&&ss!=='null'){setSDate(ss);setSt('calendar');}
    else{setSDate(fmtDate(new Date()));setSt('setup');}
  },[]);

  const sfx=useCallback(()=>lv==='junior'?'_j':'',[lv]);

  const saveRec=(mode,c,t)=>{
    if(!activeDI)return;
    const ds=activeDI.date;
    setRecords(prev=>{
      const nr={...prev};
      if(!nr[ds])nr[ds]={};
      const pr=getRec(nr[ds],mode);
      const pc=pr?pr.correct:-1;
      if(c>=pc)nr[ds][mode]={correct:c,total:t};
      localStorage.setItem('wm_rec'+sfx(),JSON.stringify(nr));
      return nr;
    });
  };

  const showCharReward=(mode)=>{
    setCharPopup(mode);
    setShowConfetti(true);
    AudioEngine.play('clear');
    setTimeout(()=>setShowConfetti(false),3500);
  };

  const lvChange=(nl)=>{
    setLv(nl);
    const s=localStorage.getItem('wm_start'+(nl==='junior'?'_j':''));
    if(s&&s!=='undefined'&&s!=='null')setSDate(s);
    else setSDate(fmtDate(new Date()));
  };

  const handleSetup=()=>{
    const fd=sDate||fmtDate(new Date());
    const isJ=lv==='junior';
    const s=isJ?'_j':'';
    const vs=isJ?JUNIOR:ELEM;
    const pv=vs.split(',').map(p=>{const[en,zh]=p.split(':');return{en,zh};});
    localStorage.setItem('wm_level',lv);
    localStorage.setItem('wm_start'+s,fd);
    let cv=[];
    const sv=localStorage.getItem('wm_vocab'+s);
    if(sv)cv=JSON.parse(sv);
    else{cv=shuffle(pv);localStorage.setItem('wm_vocab'+s,JSON.stringify(cv));}
    setVocab(cv);
    const sr=localStorage.getItem('wm_rec'+s);
    setRecords(sr?JSON.parse(sr):{});
    setSDate(fd);setSt('calendar');AudioEngine.init();
  };

  const getWords=(ds)=>{
    if(!vocab.length)return[];
    const wd=weekDiff(sDate,ds);
    const tw=Math.ceil(vocab.length/100)||1;
    const si=((wd%tw)+tw)%tw*100;
    let ww=[];for(let i=0;i<100;i++)ww.push(vocab[(si+i)%vocab.length]);
    const dow=new Date(ds).getDay();
    if(dow>=1&&dow<=5){const i=dow-1;return ww.slice(i*20,(i+1)*20);}
    else if(dow===6)return ww.filter((_,i)=>i%3===0).slice(0,30);
    else return ww.filter((_,i)=>i%3===1).slice(0,30);
  };

  const selectDay=(ds)=>{
    const w=getWords(ds);
    setActiveDI({date:ds,isWE:new Date(ds).getDay()===0||new Date(ds).getDay()===6});
    setWordsPool(w);setSt('review');setNotif('');AudioEngine.init();
  };

  const startGame=(mode)=>{
    if(mode==='sentence'){startSentence();return;}
    let tw=[];
    if(mode==='comprehensive')tw=shuffle(records[activeDI.date]?.wrongWords||[]);
    else{tw=[...wordsPool];if(activeDI&&!activeDI.isWE)tw=shuffle(tw).slice(0,15);else tw=shuffle(tw);}
    setWords(tw);setIdx(0);setInitCount(tw.length);setFpCorrect(0);setIsFirstPass(true);
    setFeedback(null);setWrongW([]);setSpkErr(false);setRtText('');heardRef.current='';
    setTestMode(mode);setSt(mode);AudioEngine.init();
  };

  const startSentence=()=>{
    const qs=buildSentenceQuestions(wordsPool);
    setSqList(qs);setSqIdx(0);setSqScore(0);setSqFb(null);setFillInp('');
    if(qs[0]?.type==='arrange'){setArrWords(shuffle(qs[0].words));setArrAns([]);}
    setTestMode('sentence');setSt('sentence');AudioEngine.init();
  };

  const speakW=(w,corr=false)=>{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      window.cu=new SpeechSynthesisUtterance(w);
      window.cu.lang='en-US';window.cu.rate=corr?0.65:0.82;window.cu.volume=1;
      window.speechSynthesis.speak(window.cu);
    }
  };

  useEffect(()=>{
    if((st==='listening'||st==='comprehensive')&&words.length>0&&!feedback){
      const cw=words[idx];
      const wr=shuffle(vocab.filter(v=>v.en!==cw.en)).slice(0,3);
      setOpts(shuffle([cw,...wr]));speakW(cw.en);
    }else if((st==='dictation-en'||st==='speaking'||st==='dictation')&&words.length>0&&!feedback){
      if(st==='dictation-en')speakW(words[idx].en);
      setRtText('');heardRef.current='';
    }
  },[idx,st,words,feedback]);

  const handleAns=(isOk)=>{
    let uw=[...wrongW];
    setSpkErr(false);
    if(!isOk&&testMode==='speaking')setTimeout(()=>speakW(words[idx].en,true),150);
    let nc=fpCorrect;
    if(isOk&&isFirstPass){nc+=1;setFpCorrect(nc);}
    if(!isOk&&isFirstPass&&activeDI&&testMode!=='comprehensive'){
      const ds=activeDI.date;
      setRecords(prev=>{
        const nr={...prev};if(!nr[ds])nr[ds]={};if(!nr[ds].wrongWords)nr[ds].wrongWords=[];
        const cw=words[idx];if(!nr[ds].wrongWords.some(x=>x.en===cw.en))nr[ds].wrongWords.push(cw);
        localStorage.setItem('wm_rec'+sfx(),JSON.stringify(nr));return nr;
      });
    }
    setFeedback(isOk?'correct':'incorrect');
    AudioEngine.play(isOk?'correct':'incorrect');
    if(!isOk){const cw=words[idx];if(!uw.some(x=>x.en===cw.en)){uw.push(cw);setWrongW(uw);}}
    setTimeout(()=>{
      if(idx<words.length-1){setIdx(p=>p+1);setFeedback(null);setInp('');setRtText('');heardRef.current='';}
      else{
        if(uw.length>0){
          AudioEngine.play('fail');
          setNotif(`還有 ${uw.length} 個單字需要複習喔！💪`);

  const onDropPool=(e)=>{e.preventDefault();const{w,src}=dragRef.current||{};if(!w||src!=='ans')return;setArrAns(p=>p.filter(x=>x!==w));setArrWords(p=>[...p,w]);};
  const clickWord=(w,src)=>{ if(src==='pool'){setArrWords(p=>p.filter(x=>x!==w));setArrAns(p=>[...p,w]);}else{setArrAns(p=>p.filter(x=>x!==w));setArrWords(p=>[...p,w]);} };

  // 口說
  const handleSpeak=()=>{
    if(isRec){if(recRef.current)recRef.current.stop();if(tmRef.current)clearTimeout(tmRef.current);setIsRec(false);return;}
    if(window.isSecureContext===false){setNotif('⚠️ 語音需要 HTTPS！');setSpkErr(true);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setNotif('❌ 建議用 Chrome/Edge！');setSpkErr(true);return;}
    const r=new SR();recRef.current=r;r.lang='en-US';r.interimResults=true;r.maxAlternatives=8;
    let done=false;heardRef.current='';setRtText('🎙️ 聆聽中...');
    r.onstart=()=>{setIsRec(true);setSpkErr(false);
      tmRef.current=setTimeout(()=>{if(!done){done=true;r.stop();setIsRec(false);const h=heardRef.current;if(h&&isFuzzy(h,words[idx]?.en||''))handleAns(true);else{handleAns(false);setNotif(h?`⏳ 聽到:"${h}"，再試試！`:'⏳ 超時！');}}},10000);};
    r.onresult=(ev)=>{if(done)return;let matched=false,lt='';const ans=words[idx]?.en||'';
      for(let i=0;i<ev.results.length;i++){for(let j=0;j<ev.results[i].length;j++){const t=ev.results[i][j].transcript;if(i===ev.results.length-1&&j===0)lt=t;if(isFuzzy(t,ans)){matched=true;lt=t;break;}}if(matched)break;}
      if(lt){heardRef.current=lt;setRtText(lt);}
      if(matched){done=true;if(tmRef.current)clearTimeout(tmRef.current);r.stop();handleAns(true);}};
    r.onerror=(ev)=>{if(done)return;done=true;if(tmRef.current)clearTimeout(tmRef.current);
      if(ev.error==='no-speech'){handleAns(false);setNotif('❌ 未偵測到聲音，大聲一點！');setIsRec(false);setSpkErr(true);setRtText('');return;}
      setNotif(`錄音失敗(${ev.error})`);setIsRec(false);setSpkErr(true);setRtText('');};
    r.onend=()=>{if(!done){done=true;if(tmRef.current)clearTimeout(tmRef.current);const h=heardRef.current;if(h&&h!=='🎙️ 聆聽中...'&&isFuzzy(h,words[idx]?.en||''))handleAns(true);else{handleAns(false);setNotif(h&&h!=='🎙️ 聆聽中...'?`❌ 說了:"${h}"，再試一次！`:'❌ 未偵測到語音！');}}setIsRec(false);setTimeout(()=>setRtText(''),800);};
    try{r.start();}catch(e){setNotif('啟動麥克風失敗！');setIsRec(false);setSpkErr(true);}

  // LISTENING
  const rListening=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:560,position:'relative',overflow:'hidden'}}>
      {rFb()}

      <div style={{textAlign:'center',margin:'16px 0 24px'}}>
        <button onClick={()=>speakW(words[idx].en)} style={{background:'linear-gradient(135deg,#a2d2ff,#6eb5ff)',border:'none',borderRadius:'50%',width:100,height:100,cursor:'pointer',boxShadow:'0 6px 0 rgba(110,181,255,0.4)',transition:'all 0.2s',display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'2.5rem'}}>

        </button>

          </button>

      </div>

  // DICTATION
  const rDictation=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:520,position:'relative',overflow:'hidden'}}>
      {rFb()}
      <div style={{textAlign:'center',marginBottom:8}}><span style={{background:'#fff0f5',borderRadius:99,padding:'6px 20px',fontWeight:800,color:'#ff8fab',fontSize:'0.9rem'}}>第 {idx+1} / {words.length} 題</span></div>
      <div style={{textAlign:'center',margin:'20px 0'}}>

      </div>
      <form onSubmit={e=>{e.preventDefault();if(!feedback&&inp.trim())handleAns(words[idx].en.toLowerCase()===inp.trim().toLowerCase());}} style={{display:'flex',flexDirection:'column',gap:12}}>

        <button type="submit" disabled={!!feedback||!inp} className="candy-btn" style={{padding:'16px',background:'linear-gradient(135deg,#ffc8dd,#ff8fab)',color:'white',fontSize:'1.1rem',border:'none',opacity:(!feedback&&inp)?1:0.5}}>
          確定送出 ✓
        </button>
      </form>
    </div>
  );

  // DICTATION-EN
  const rDictEn=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:520,position:'relative',overflow:'hidden'}}>
      {rFb()}
      <div style={{textAlign:'center',marginBottom:8}}><span style={{background:'#fff8e1',borderRadius:99,padding:'6px 20px',fontWeight:800,color:'#ffb830',fontSize:'0.9rem'}}>第 {idx+1} / {words.length} 題</span></div>
      <div style={{textAlign:'center',margin:'20px 0 24px'}}>
        <button onClick={()=>speakW(words[idx].en)} style={{background:'linear-gradient(135deg,#ffda77,#ffb830)',border:'none',borderRadius:'50%',width:90,height:90,cursor:'pointer',boxShadow:'0 6px 0 rgba(255,184,48,0.4)',fontSize:'2.2rem',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>🎧</button>
        <p style={{color:'#ccc',fontWeight:700,marginTop:12,fontSize:'0.85rem'}}>聽發音，默寫出英文單字</p>
      </div>
      <form onSubmit={e=>{e.preventDefault();if(!feedback&&inp.trim())handleAns(words[idx].en.toLowerCase()===inp.trim().toLowerCase());}} style={{display:'flex',flexDirection:'column',gap:12}}>
        <input value={inp} onChange={e=>setInp(e.target.value)} disabled={!!feedback} placeholder="輸入英文..." className="kawaii-input" autoFocus/>
        <button type="submit" disabled={!!feedback||!inp} className="candy-btn" style={{padding:'16px',background:'linear-gradient(135deg,#ffda77,#ffb830)',color:'white',fontSize:'1.1rem',border:'none',opacity:(!feedback&&inp)?1:0.5}}>確定送出 ✓</button>
      </form>
    </div>
  );

  // SPEAKING
  const rSpeaking=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:520,position:'relative',overflow:'hidden',textAlign:'center'}}>
      {rFb()}
      <div style={{marginBottom:8}}><span style={{background:'#f0fff4',borderRadius:99,padding:'6px 20px',fontWeight:800,color:'#7ecb6e',fontSize:'0.9rem'}}>第 {idx+1} / {words.length} 題</span></div>
      <div style={{margin:'16px 0 4px',display:'flex',justifyContent:'center',alignItems:'center',gap:12}}>
        <span style={{fontSize:'3.2rem',fontWeight:900,color:'#555'}}>{words[idx]?.en}</span>
        <button onClick={()=>speakW(words[idx]?.en)} style={{background:'#f0fff4',border:'2px solid #caffbf',borderRadius:12,padding:8,cursor:'pointer',fontSize:'1.1rem'}}>🔊</button>
      </div>
      <div style={{color:'#bbb',fontWeight:700,marginBottom:12,fontSize:'1.1rem'}}>{words[idx]?.zh}</div>
      <div style={{background:'#f0fff4',borderRadius:16,padding:'6px 16px',display:'inline-block',color:'#aaa',fontSize:'0.75rem',fontWeight:700,marginBottom:16,border:'2px solid #caffbf'}}>發音接近即可通過 · 已放寬容錯</div>
      <div style={{minHeight:48,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16}}>
        {rtText?<div style={{background:'#e8faf0',borderRadius:99,padding:'8px 24px',color:'#5cb85c',fontWeight:800,fontSize:'1rem',border:'2px solid #caffbf'}}>&ldquo;{rtText}&rdquo;</div>

      </div>
      <button onClick={handleSpeak} disabled={!!feedback} style={{width:120,height:120,borderRadius:'50%',border:`6px solid ${isRec?'#caffd8':'#caffbf'}`,background:isRec?'linear-gradient(135deg,#ff8fab,#ff6b9d)':'linear-gradient(135deg,#caffbf,#7ecb6e)',cursor:'pointer',fontSize:'3rem',boxShadow:isRec?'0 0 0 8px rgba(255,143,171,0.3)':'0 6px 0 rgba(126,203,110,0.4)',transition:'all 0.2s',animation:isRec?'pulse-gentle 1s ease-in-out infinite':'none'}}>

      </button>
      {isRec&&<div style={{marginTop:12,color:'#ff8fab',fontWeight:800,fontSize:'0.85rem'}}>錄音中... 點擊可停止</div>}
      {!isRec&&!feedback&&<p style={{marginTop:12,color:'#7ecb6e',fontWeight:700,fontSize:'0.9rem'}}>點擊麥克風，念出英文單字！</p>}
      {spkErr&&!feedback&&<div style={{marginTop:8,color:'#ff8fab',fontSize:'0.8rem',fontWeight:700}}>⚠️ 請確認麥克風已授權</div>}
    </div>

  // SENTENCE
  const rSentence=()=>{
    const q=sqCurrent();
    if(!q)return null;
    const prog=sqIdx+1,total=sqList.length;
    const typeLabel={fill_blank:'📝 填空題',choice:'🔤 選擇題',arrange:'🔀 排列造句'}[q.type]||'';
    return(
      <div className="kawaii-card animate-slide-up" style={{padding:28,width:'100%',maxWidth:600,position:'relative',overflow:'hidden'}}>
        {/* 句型Feedback */}
        {sqFb&&(
          <div style={{position:'absolute',inset:0,borderRadius:28,background:sqFb==='correct'?'rgba(202,255,191,0.97)':'rgba(255,200,221,0.97)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:20}}>
            <div className={sqFb==='correct'?'animate-bounce-in':'animate-shake'} style={{textAlign:'center'}}>

              {q.type==='fill_blank'&&sqFb==='incorrect'&&<div style={{marginTop:8,fontWeight:700,color:'#888'}}>正確答案：<span style={{color:'#6b8cff',fontWeight:900}}>{q.blank_word}</span> ({q.blank_word_zh})</div>}

        {/* 進度 */}
        <div style={{marginBottom:16}}>

            <span style={{background:'#e9d8fd',borderRadius:99,padding:'4px 14px',fontWeight:800,color:'#9c6b9a',fontSize:'0.8rem'}}>{typeLabel}</span>

          <div style={{background:'#f5f0ff',borderRadius:99,height:12,overflow:'hidden'}}>
            <div className="progress-bar" style={{width:`${(prog/total)*100}%`,height:'100%'}}/>

        </div>
        {/* 填空題 */}
        {q.type==='fill_blank'&&(<>
          <div style={{fontSize:'1.4rem',fontWeight:800,color:'#555',textAlign:'center',marginBottom:8,lineHeight:1.6}}>

          </div>
          <div style={{textAlign:'center',color:'#ccc',fontSize:'0.85rem',marginBottom:16,fontWeight:700}}>💡 {q.hint}</div>
          <form onSubmit={e=>{e.preventDefault();if(!sqFb&&fillInp.trim())sqNext(fillInp.trim().toLowerCase()===q.blank_word.toLowerCase());}} style={{display:'flex',flexDirection:'column',gap:10}}>
            <input value={fillInp} onChange={e=>setFillInp(e.target.value)} disabled={!!sqFb} placeholder="填入英文單字..." className="kawaii-input" autoFocus/>
            <button type="submit" disabled={!!sqFb||!fillInp} className="candy-btn" style={{padding:'14px',background:'linear-gradient(135deg,#cdb4db,#b08ecf)',color:'white',fontSize:'1.05rem',border:'none',opacity:(!sqFb&&fillInp)?1:0.5}}>確定送出 ✓</button>

        {/* 選擇題 */}

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {q.options_template.map((o,i)=>(
              <button key={i} onClick={()=>{if(!sqFb)sqNext(o===q.answer);}} disabled={!!sqFb}

        {q.type==='arrange'&&(<>
          <div style={{color:'#bbb',fontSize:'0.85rem',fontWeight:700,textAlign:'center',marginBottom:12}}>點擊單字排列成正確句子 👇</div>

                {w}
              </span>

          </div>
          {/* 單字池 */}
          <div onDragOver={e=>e.preventDefault()} onDrop={onDropPool}
            style={{minHeight:56,background:'#fafafa',border:'2px solid #eee',borderRadius:18,padding:'10px 12px',marginBottom:12,display:'flex',flexWrap:'wrap',gap:8,alignItems:'center'}}>
            {arrWords.map((w,i)=>(
              <span key={`p${i}${w}`} draggable onDragStart={()=>onDragStart(w,'pool')} onClick={()=>clickWord(w,'pool')}

  // RESULT

    const allDone=MODES.every(m=>getRec(r,m)!==null);
    const wl=r.wrongWords||[];const needComp=allDone&&wl.length>0&&!r.comprehensiveDone;const full=allDone&&!needComp;
    const score=dayScore(r);
    const ms=Math.round((fpCorrect/initCount)*20);
    return(
      <div className="kawaii-card animate-bounce-in" style={{padding:40,maxWidth:460,width:'100%',textAlign:'center',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,background:'radial-gradient(circle at 50% 30%,rgba(255,218,119,0.2),transparent 70%)',pointerEvents:'none'}}/>
        <div className="animate-float" style={{display:'inline-block',marginBottom:12}}>
          {Characters.star(130)}
        </div>
        <h2 style={{fontSize:'2.5rem',fontWeight:900,color:'#555',marginBottom:8}}>
          {testMode==='comprehensive'?'錯題全擊破！ 🏆':testMode==='sentence'?'句型挑戰完成！ 📚':'測驗完成！ 🌸'}

        <p style={{fontSize:'1.4rem',fontWeight:900,color:'#888',marginBottom:4}}>
          答對 <span style={{color:'#ffb830',fontSize:'2rem'}}>{fpCorrect}</span> / {initCount} 題
        </p>
        {testMode!=='comprehensive'&&<div style={{background:'#fff8e1',borderRadius:16,padding:'8px 20px',display:'inline-block',color:'#f9a825',fontWeight:800,marginBottom:24}}>單項積分：{ms} / 20 分</div>}
        {full&&<div style={{background:'linear-gradient(135deg,#ffda77,#ffb830)',borderRadius:20,padding:'14px',marginBottom:20,color:'#7a5200',fontWeight:900,fontSize:'1.1rem'}}>🎊 五項全達成！總分 {score} / 100 分</div>}
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {needComp
            ?<button className="candy-btn" onClick={()=>setSt('menu')} style={{padding:'16px',background:'linear-gradient(135deg,#ffc8dd,#ff8fab)',color:'white',fontSize:'1.05rem',border:'none'}}>⚠️ 還有錯題，去練習！</button>
            :full?<button className="candy-btn" onClick={()=>setSt('calendar')} style={{padding:'16px',background:'linear-gradient(135deg,#caffbf,#7ecb6e)',color:'white',fontSize:'1.05rem',border:'none'}}>✅ 完美！回到日曆</button>
            :<button className="candy-btn" onClick={()=>setSt('menu')} style={{padding:'16px',background:'linear-gradient(135deg,#a2d2ff,#6eb5ff)',color:'white',fontSize:'1.05rem',border:'none'}}>← 返回測驗選單</button>}
        </div>
      </div>
    );
  };

  // 背景漸層
  const bgMap={
    setup:'linear-gradient(135deg,#fff0f5 0%,#fce4ec 50%,#f8bbd0 100%)',
    calendar:'linear-gradient(135deg,#fce4ec 0%,#e1bee7 50%,#ce93d8 100%)',
    review:'linear-gradient(135deg,#e3f2fd 0%,#bbdefb 100%)',
    menu:'linear-gradient(135deg,#fce4ec 0%,#e1bee7 100%)',
    listening:'linear-gradient(135deg,#e3f2fd 0%,#bbdefb 100%)',
    'dictation-en':'linear-gradient(135deg,#fff8e1 0%,#ffecb3 100%)',
    dictation:'linear-gradient(135deg,#fce4ec 0%,#f8bbd0 100%)',
    speaking:'linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 100%)',
    comprehensive:'linear-gradient(135deg,#fce4ec 0%,#ffccbc 100%)',
    result:'linear-gradient(135deg,#fffde7 0%,#fff9c4 100%)',
    sentence:'linear-gradient(135deg,#f3e5f5 0%,#e1bee7 100%)',
  };

  const headerTitles={listening:'🎵 聽力中譯','dictation-en':'🎧 聽音默寫',dictation:'✏️ 中翻英默寫',speaking:'🎤 口說挑戰',comprehensive:'🏋️ 錯題練習',sentence:'📚 句型文法'};
  const headerAccents={listening:'#6eb5ff','dictation-en':'#ffb830',dictation:'#ff8fab',speaking:'#7ecb6e',comprehensive:'#ff8fab',sentence:'#b08ecf'};
  const gameStates=['listening','dictation-en','dictation','speaking','comprehensive','sentence'];

  return(
    <div style={{minHeight:'100vh',background:bgMap[st]||bgMap.setup,padding:'20px 16px',display:'flex',flexDirection:'column',alignItems:'center',transition:'background 0.6s ease',position:'relative',overflow:'hidden'}}>
      {/* 背景裝飾星星 */}
      {['⭐','💕','✨','🌸','💫','🎀'].map((s,i)=>(
        <div key={i} style={{position:'fixed',top:`${10+i*14}%`,left:i%2===0?'3%':'92%',fontSize:`${1.2+i*0.15}rem`,opacity:0.3,animation:`float ${3+i*0.5}s ease-in-out ${i*0.4}s infinite`,pointerEvents:'none'}}>
          {s}
        </div>
      ))}

      {rNotif()}
      {rBak()}
      {showConfetti&&<Confetti/>}
      {charPopup&&<CharacterPopup mode={charPopup} onClose={()=>setCharPopup(null)}/>}

      <div style={{width:'100%',maxWidth:1000,flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24}}>
        {gameStates.includes(st)&&rGameHdr(headerTitles[st]||'', headerAccents[st]||'#ff8fab')}

        {st==='setup'&&rSetup()}
        {st==='calendar'&&rCal()}
        {st==='review'&&rReview()}
        {st==='menu'&&rMenu()}
        {(st==='listening'||st==='comprehensive')&&rListening()}
        {st==='dictation-en'&&rDictEn()}
        {st==='dictation'&&rDictation()}
        {st==='speaking'&&rSpeaking()}
        {st==='sentence'&&rSentence()}
        {st==='result'&&rResult()}
      </div>

      <div style={{marginTop:24,color:'rgba(180,120,150,0.6)',fontWeight:800,fontSize:'0.8rem',letterSpacing:'0.05em',background:'rgba(255,255,255,0.3)',borderRadius:99,padding:'6px 20px',backdropFilter:'blur(4px)'}}>
        妳必須努力，才能看起來毫不費力 🌸
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
