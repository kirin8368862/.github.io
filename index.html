<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Nunito','Noto Sans TC',sans-serif;}
:root{

html,body{height:100%;height:100dvh;overflow:hidden;background:#fdfbfd;}
#root{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
/* 安全區域 */
.safe-t{padding-top:env(safe-area-inset-top,0px);}
.safe-b{padding-bottom:env(safe-area-inset-bottom,0px);}

/* 動畫 */
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes float2{0%,100%{transform:translateY(0) rotate(2deg)}50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes bounceIn{0%{transform:scale(0) rotate(-12deg);opacity:0}55%{transform:scale(1.15) rotate(4deg)}75%{transform:scale(0.93)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes rainbowBg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(800deg);opacity:0}}
@keyframes charPop{0%{transform:scale(0) translateY(30px);opacity:0}60%{transform:scale(1.1) translateY(-5px);opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes slideUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.af{animation:float 3.2s ease-in-out infinite}
.af2{animation:float2 3.8s ease-in-out 0.5s infinite}
.abi{animation:bounceIn 0.45s cubic-bezier(.175,.885,.32,1.275) forwards}
.ash{animation:shake 0.4s ease both}
.aw{animation:wiggle 0.4s ease infinite}
.ap{animation:pulse 1.8s ease-in-out infinite}
.asu{animation:slideUp 0.35s ease forwards}
.acp{animation:charPop 0.5s cubic-bezier(.175,.885,.32,1.275) forwards}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:999px;cursor:pointer;font-weight:900;transition:all 0.14s;outline:none;position:relative;}
.btn:active{transform:scale(0.93)!important;}
.btn-dark{background:#2d2b36;color:#fff;box-shadow:0 4px 0 #111;}
.btn-pink{background:linear-gradient(135deg,#f48fb1,#e91e8c);color:#fff;box-shadow:0 4px 0 #c2185b;}
.btn-ghost{background:rgba(45,43,54,0.08);color:#2d2b36;}

/* 輸入框 */
.inp{border:3px solid #e1bee7;border-radius:16px;background:#fdfbfd;font-weight:800;font-size:1.1rem;text-align:center;padding:11px 14px;outline:none;width:100%;transition:all 0.2s;color:#2d2b36;}
.inp:focus{border-color:#8e78a6;background:#fff;box-shadow:0 0 0 3px rgba(142,120,166,0.15);}

/* 進度條 */
.pbar{height:10px;border-radius:99px;background:linear-gradient(90deg,#ff9a9e,#fecfef,#a1c4fd,#c2e9fb);background-size:200% 100%;animation:rainbowBg 3s ease infinite;transition:width 0.4s;}

/* 彩帶 */
.confetti{position:fixed;border-radius:2px;animation:confettiFall linear forwards;pointer-events:none;z-index:999;}

/* 頁面層 */
.page{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* 卡片 */
.card{background:white;border-radius:20px;box-shadow:0 6px 0 rgba(142,120,166,0.15),0 10px 28px rgba(142,120,166,0.1);border:2px solid rgba(225,190,231,0.4);}

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ══════════ 音效 ══════════
const AU=(()=>{
  let ctx=null,ok=false;
  const init=()=>{try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C();}if(ctx&&ctx.state==='suspended')ctx.resume();if(ctx&&!ok){const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);ok=true;}}catch(e){}};
  const t=(f,ty,d,v=0.28)=>{try{if(!ctx)return;const n=ctx.currentTime;const o=ctx.createOscillator();const g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(0.001,n+d);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+d);}catch(e){}};
  return{init,play(type){
    init();
    if(type==='correct'){t(659,'sine',0.1,0.3);setTimeout(()=>t(880,'sine',0.1,0.3),80);setTimeout(()=>t(1047,'sine',0.2,0.4),160);}
    else if(type==='incorrect'){t(300,'sawtooth',0.14,0.28);setTimeout(()=>t(220,'sawtooth',0.22,0.28),140);}
    else if(type==='clear'){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>t(f,'sine',0.1,0.28),i*55));setTimeout(()=>{t(1047,'sine',0.35,0.5);t(784,'sine',0.35,0.5);},330);}
    else if(type==='fail'){t(392,'triangle',0.18,0.28);setTimeout(()=>t(330,'triangle',0.35,0.28),190);}
  }};
})();

// ══════════ 口說辨識 ══════════
const getLev=(a,b)=>{const dp=Array.from({length:b.length+1},(_,i)=>[i]);for(let j=0;j<=a.length;j++)dp[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)dp[i][j]=b[i-1]===a[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i][j-1],dp[i-1][j]);return dp[b.length][a.length];};
const PHON={'ph':'f','ck':'k','gh':'g','kn':'n','wr':'r','mb':'m','wh':'w','qu':'kw','tch':'ch'};
const norm=s=>{let r=s.toLowerCase().trim();Object.entries(PHON).forEach(([f,v])=>{r=r.replaceAll(f,v);});return r;};
const isFuzzy=(spoken,target)=>{
  let cs=spoken.toLowerCase().replace(/[^a-z0-9 ]/g,'');
  const ct=target.toLowerCase().replace(/[^a-z]/g,'').trim();
  if(cs.includes(ct))return true;
  const words=cs.split(/\s+/);
  for(const w of words){
    if(!w)continue;
    if(w===ct)return true;
    const thr=Math.ceil(ct.length/2);
    if(getLev(w,ct)<=thr)return true;
    const nw=norm(w),nt=norm(ct);
    if(getLev(nw,nt)<=thr)return true;
    const pLen=ct.length<=4?2:3;
    if(w.length>=pLen&&ct.length>=pLen&&(w.startsWith(ct.slice(0,pLen))||ct.startsWith(w.slice(0,pLen))))return true;
    if(ct.length>=6){const pl=Math.ceil(ct.length*0.62);if(w.startsWith(ct.slice(0,pl)))return true;}
  }
  return cs.replace(/\s/g,'').includes(ct);
};

// ══════════ 故事 AI 生成 ══════════
async function genStory(wordPool){
  const sh=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const ws=sh(wordPool).slice(0,7);
  const wl=ws.map(w=>`${w.en}(${w.zh})`).join('、');
  const prompt=`你是一位國小英語老師。請用以下英文單字，創作一篇有趣的英文小故事，適合國小學生程度。

單字清單：${wl}

要求：
1. 故事要有完整情節：有起因、發展、結尾，角色行動要合乎邏輯
2. 英文5~6句，語言自然流暢，適合朗讀練習
3. 主角請使用三麗鷗角色（如 Kuromi 酷洛米、My Melody 美樂蒂）
4. 每個指定單字自然融入故事，不要生硬
5. 提供完整中文翻譯和3個朗讀重點提示

只回傳 JSON，不要 markdown：
{"title":"故事標題","en":"英文故事","zh":"中文翻譯","tips":["提示1","提示2","提示3"],"words_used":["單字1","單字2"]}`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:900,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();
    const txt=data.content?.map(i=>i.text||'').join('')||'{}';
    return JSON.parse(txt.replace(/```json|```/g,'').trim());
  }catch(e){
    // 備用：有邏輯的故事
    const w=ws;while(w.length<5)w.push({en:'happy',zh:'快樂的'});
    const templates=[
      {title:"酷洛米的驚喜禮物",en:`One morning, Kuromi woke up feeling very ${w[0].en}. She decided to give her friend Melody a ${w[1].en} as a surprise gift. Kuromi walked to the ${w[2].en} and looked for something special. She found a beautiful ${w[3].en} and wrapped it carefully. When Melody opened the gift, she felt so ${w[4].en} that she gave Kuromi a big hug. "You are the best friend ever!" Melody said with a ${w[5]?.en||'big'} smile.`,zh:`一天早上，酷洛米醒來感到非常「${w[0].zh}」。她決定送好友美樂蒂一個「${w[1].zh}」作為驚喜禮物。酷洛米走到「${w[2].zh}」，尋找特別的東西。她找到了一個美麗的「${w[3].zh}」，小心翼翼地包好。當美樂蒂打開禮物，她感到如此「${w[4].zh}」，緊緊擁抱了酷洛米。「你是最棒的朋友！」美樂蒂帶著「${w[5]?.zh||'大大的'}」微笑說道。`,tips:["注意 felt so + 形容詞 的用法","gave 是 give 的過去式","best friend ever 是超好用的讚美語"],words_used:w.slice(0,6).map(x=>x.en)},
      {title:"美樂蒂的魔法下午",en:`My Melody had a wonderful afternoon at home. She was feeling very ${w[0].en} because she found a ${w[1].en} in her garden. "What a beautiful ${w[1].en}!" she said. She decided to ${w[2].en} with it all afternoon. Her friend Cinnamoroll came over and they played together under the ${w[3].en} sky. By evening, both friends were ${w[4].en} but very happy. They promised to meet again tomorrow.`,zh:`美樂蒂在家度過了美好的下午。她感到非常「${w[0].zh}」，因為她在花園裡發現了一個「${w[1].zh}」。「多麼美麗的${w[1].zh}啊！」她說。她決定整個下午都「${w[2].zh}」。她的朋友大耳狗來找她，兩人在「${w[3].zh}」的天空下一起玩耍。到了傍晚，兩個朋友都「${w[4].zh}」了但非常快樂，並約好明天再見。`,tips:["had a wonderful afternoon 描述美好的午後","What a + 形容詞 + 名詞 是感嘆句","promised to + 動詞原形 表示承諾"],words_used:w.slice(0,5).map(x=>x.en)},
    ];
    return templates[Math.floor(Math.random()*templates.length)];
  }
}

// ══════════ StoryReader ══════════
function StoryReader({wordPool,onBack,setNotif}){
  const [story,setStory]=useState(null);
  const [loading,setLoading]=useState(true);
  const [isPlaying,setIsPlaying]=useState(false);
  const [rate,setRate]=useState(0.85);
  const [isRec,setIsRec]=useState(false);
  const [rtText,setRtText]=useState('');
  const [score,setScore]=useState(null);
  const [scoreDetail,setScoreDetail]=useState(null);
  const recRef=useRef(null);
  const tmRef=useRef(null);
  const heardRef=useRef('');

  const load=useCallback(async()=>{
    setLoading(true);setStory(null);setScore(null);setScoreDetail(null);setRtText('');
    const s=await genStory(wordPool);
    setStory(s);setLoading(false);
  },[wordPool]);

  useEffect(()=>{load();},[]);
  useEffect(()=>()=>{window.speechSynthesis?.cancel();if(recRef.current)try{recRef.current.stop();}catch(e){}if(tmRef.current)clearTimeout(tmRef.current);},[]);

  const togglePlay=()=>{
    if(!('speechSynthesis' in window))return;
    if(isPlaying){window.speechSynthesis.cancel();setIsPlaying(false);return;}
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(story?.en||'');
    u.lang='en-US';u.rate=rate;u.volume=1;
    u.onend=()=>setIsPlaying(false);
    setIsPlaying(true);window.speechSynthesis.speak(u);
  };

  const startRec=()=>{
    if(isRec){if(recRef.current)try{recRef.current.stop();}catch(e){}setIsRec(false);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setNotif('❌ 不支援語音辨識！');return;}
    const r=new SR();recRef.current=r;r.lang='en-US';r.interimResults=true;r.continuous=true;
    let done=false;let heard='';
    setRtText('🎙️ 聆聽中，請跟著朗讀...');setScore(null);setScoreDetail(null);
    r.onstart=()=>{setIsRec(true);tmRef.current=setTimeout(()=>{if(!done){done=true;try{r.stop();}catch(e){}}},25000);};
    r.onresult=ev=>{if(done)return;let lt='';for(let i=0;i<ev.results.length;i++)lt+=ev.results[i][0].transcript+' ';setRtText(lt);heard=lt;heardRef.current=lt;};
    r.onerror=()=>{if(!done){done=true;setIsRec(false);}};
    r.onend=()=>{
      if(!done){done=true;}setIsRec(false);
      const h=heardRef.current||heard;
      if(!h||h==='🎙️ 聆聽中，請跟著朗讀...'){setRtText('');return;}
      // ★ 詳細評分計算
      const spokenWs=h.toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean);
      const storyWs=(story?.en||'').toLowerCase().replace(/[^a-z ]/g,'').split(/\s+/).filter(Boolean);
      // 計算匹配詞彙
      let matched=0;const matchedWords=[];const missedWords=[];
      const spokenSet=new Set(spokenWs);
      storyWs.forEach(w=>{if(spokenSet.has(w)){matched++;matchedWords.push(w);}else{missedWords.push(w);}});
      // 計算關鍵詞（story.words_used）命中
      const keyWords=(story?.words_used||[]);
      const keyHit=keyWords.filter(w=>spokenSet.has(w.toLowerCase()));
      const keyScore=keyWords.length>0?Math.round(keyHit.length/keyWords.length*100):100;
      // 總分：詞彙覆蓋率 60% + 關鍵詞 40%
      const vocabScore=Math.min(100,Math.round((matched/Math.max(storyWs.length,1))*100*1.4));
      const total=Math.min(100,Math.round(vocabScore*0.6+keyScore*0.4));
      setScore(total);
      setScoreDetail({vocabScore,keyScore,keyHit,missedImportant:keyWords.filter(w=>!spokenSet.has(w.toLowerCase())),total});
      setRtText(h);
    };
    try{r.start();}catch(e){setIsRec(false);}
  };

  const ScoreDisplay=()=>{
    if(score===null)return null;
    const d=scoreDetail;
    const grade=score>=90?{g:'S',c:'#f57f17',msg:'完美！酷洛米要拜你為師了！'}:score>=75?{g:'A',c:'#2e7d32',msg:'太厲害了！繼續保持！'}:score>=55?{g:'B',c:'#1565c0',msg:'不錯喔！再練習幾次更好！'}:{g:'C',c:'#c62828',msg:'要加油了！多聽幾次再試試！'};
    return(
      <div className="abi" style={{background:'white',borderRadius:18,padding:'14px',border:'2px solid #e1bee7',marginTop:10}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
          <div style={{width:60,height:60,borderRadius:'50%',background:grade.c,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.8rem',fontWeight:900,color:'white',flexShrink:0}}>{grade.g}</div>
          <div>
            <div style={{fontWeight:900,fontSize:'1.3rem',color:grade.c}}>{score} 分</div>
            <div style={{fontWeight:700,fontSize:'0.82rem',color:'#666'}}>{grade.msg}</div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:'0.78rem',marginBottom:8}}>
          <div style={{background:'#f3e5f5',borderRadius:12,padding:'8px 10px'}}>
            <div style={{color:'#7b1fa2',fontWeight:800}}>詞彙覆蓋率</div>
            <div style={{fontWeight:900,fontSize:'1.1rem',color:'#4a148c'}}>{d.vocabScore}分</div>
          </div>
          <div style={{background:'#e8f5e9',borderRadius:12,padding:'8px 10px'}}>
            <div style={{color:'#1b5e20',fontWeight:800}}>關鍵單字命中</div>
            <div style={{fontWeight:900,fontSize:'1.1rem',color:'#1b5e20'}}>{d.keyScore}分</div>
          </div>
        </div>
        {d.keyHit.length>0&&<div style={{marginBottom:6}}>
          <div style={{fontSize:'0.75rem',fontWeight:800,color:'#2e7d32',marginBottom:3}}>✅ 讀到的關鍵詞：</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{d.keyHit.map((w,i)=><span key={i} style={{background:'#c8e6c9',color:'#1b5e20',padding:'2px 8px',borderRadius:99,fontSize:'0.72rem',fontWeight:800}}>{w}</span>)}</div>
        </div>}
        {d.missedImportant.length>0&&<div>
          <div style={{fontSize:'0.75rem',fontWeight:800,color:'#c62828',marginBottom:3}}>⚠️ 需要加強的單字：</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{d.missedImportant.map((w,i)=><span key={i} style={{background:'#ffcdd2',color:'#b71c1c',padding:'2px 8px',borderRadius:99,fontSize:'0.72rem',fontWeight:800}}>{w}</span>)}</div>
        </div>}
      </div>
    );
  };

  if(loading)return(
    <div className="page" style={{background:'linear-gradient(160deg,#f3e5f5,#e8f5e9)',alignItems:'center',justifyContent:'center',gap:16}}>
      <div style={{width:48,height:48,border:'4px solid #e1bee7',borderTopColor:'#8e78a6',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>

        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,padding:'0 2px'}}>

        </div>
        {/* 操作按鈕 */}

          <button onClick={startRec} className="btn" style={{padding:'12px 8px',background:isRec?'#f44336':'#c8e6c9',color:isRec?'#fff':'#2e7d32',fontSize:'0.88rem',animation:isRec?'pulse 1s ease infinite':'none'}}>{isRec?'⏹️ 停止錄音':'🎤 跟讀評分'}</button>
        </div>
        {/* 辨識結果 */}
        {(rtText&&rtText!=='🎙️ 聆聽中，請跟著朗讀...')&&<div style={{background:'white',borderRadius:14,padding:'10px 12px',border:'2px dashed #e1bee7',marginBottom:8}}>

        <ScoreDisplay/>
      </div>
    </div>
  );
}

const WTAGS={animal_pet:['cat','dog','bird','fish','rabbit','horse','monkey','elephant','tiger','lion','bear','duck','pig','sheep','turtle','frog'],adj:['happy','sad','big','small','tall','short','hot','cold','fast','slow','clean','beautiful','funny','tired','hungry','cute','smart'],verb:['run','swim','jump','sing','dance','draw','read','play','cook','eat','sleep','study','walk','ride','fly','laugh'],thing:['book','pen','ball','bag','key','hat','cup','phone','clock','desk','chair']};
const sh=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
function buildSQ(pool){
  const pick=tag=>{const arr=(WTAGS[tag]||[]).filter(w=>pool.some(p=>p.en===w));const fb=pool[Math.floor(Math.random()*pool.length)]||{en:'cat',zh:'貓'};return arr.length?pool.find(p=>p.en===arr[Math.floor(Math.random()*arr.length)])||fb:fb;};
  return sh(STPLS).slice(0,15).map(tpl=>{
    if(tpl.type==='fill_blank'){const w=pick(tpl.tags[0]);return{type:'fill_blank',sentence:tpl.tpl,blank:w.en,blankZh:w.zh,hint:`中文：「${w.zh}」`,translation:tpl.zh.replace('___',`(${w.zh})`),tip:tpl.tip};}
    else if(tpl.type==='choice'){return{type:'choice',sentence:tpl.s,opts:tpl.opts,ans:tpl.ans,translation:tpl.zh,tip:tpl.tip};}
    else{return{type:'arrange',words:sh(tpl.words),ans:tpl.ans,translation:tpl.zh,tip:tpl.tip};}
  });
}

k:工作,world:世界,write:寫,year:年,yellow:黃色的,yes:是的,you:你,zoo:動物園";

const fd=d=>{const dt=new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
const wdiff=(s,t)=>{const sd=new Date(s);sd.setHours(0,0,0,0);const sD=sd.getDay()||7;sd.setDate(sd.getDate()-sD+1);const td=new Date(t);td.setHours(0,0,0,0);const tD=td.getDay()||7;td.setDate(td.getDate()-tD+1);return Math.max(0,Math.round((td-sd)/604800000));};
const gR=(rec,mode)=>{if(!rec||rec[mode]===undefined)return null;if(typeof rec[mode]==='number')return{correct:rec[mode]/10,total:rec[mode]/10};return rec[mode];};
const MODES=['listening','dictation','speaking','dictation-en','sentence'];

// ══════════ APP ══════════
function App(){
  const[pg,setPg]=useState('setup');
  const[sDate,setSDate]=useState('');
  const[vocab,setVocab]=useState([]);
  const[recs,setRecs]=useState({});
  const[adi,setAdi]=useState(null);
  const[pool,setPool]=useState([]);
  const[mode,setMode]=useState(null);
  const[wds,setWds]=useState([]);
  const[qi,setQi]=useState(0);
  const[initN,setInitN]=useState(0);
  const[fp,setFp]=useState(0);
  const[isFirst,setIsFirst]=useState(true);
  const[fb,setFb]=useState(null);
  const[notif,setNotif]=useState('');
  const[wrongW,setWrongW]=useState([]);
  const[opts,setOpts]=useState([]);
  const[inp,setInp]=useState('');
  const[isRec,setIsRec]=useState(false);
  const[rtTxt,setRtTxt]=useState('');
  const[reward,setReward]=useState(null);
  const[confetti,setConfetti]=useState(false);
  // 句型
  const[sqList,setSqList]=useState([]);
  const[sqI,setSqI]=useState(0);
  const[sqFb,setSqFb]=useState(null);
  const[fillInp,setFillInp]=useState('');
  const[arrW,setArrW]=useState([]);
  const[arrA,setArrA]=useState([]);
  const[wrongSq,setWrongSq]=useState([]);
  const[sqIsFirst,setSqIsFirst]=useState(true);
  const[fpSq,setFpSq]=useState(0);
  const[sqInitN,setSqInitN]=useState(0);
  // ★ 每題隨機角色（穿插激勵）
  const[qChar,setQChar]=useState('kuromi');

  const recRef=useRef(null);
  const tmRef=useRef(null);
  const heardRef=useRef('');

  // 每次換題時隨機換角色
  const nextChar=useCallback(()=>{
    const list=CHAR_LIST.filter(c=>c!==qChar);
    setQChar(list[Math.floor(Math.random()*list.length)]);
  },[qChar]);

  useEffect(()=>{
    const ss=localStorage.getItem('wm_start');const sr=localStorage.getItem('wm_rec');const sv=localStorage.getItem('wm_vocab');
    const pv=ELEM.split(',').map(p=>{const[en,zh]=p.split(':');return{en,zh};});
    if(sv)setVocab(JSON.parse(sv));else{const s=sh(pv);setVocab(s);localStorage.setItem('wm_vocab',JSON.stringify(s));}
    if(sr)setRecs(JSON.parse(sr));
    if(ss&&ss!=='undefined'&&ss!=='null'){setSDate(ss);setPg('calendar');}
    else{setSDate(fd(new Date()));setPg('setup');}
    const u=()=>AU.init();document.addEventListener('click',u,{once:true});document.addEventListener('touchstart',u,{once:true});
  },[]);

  useEffect(()=>()=>{if(tmRef.current)clearTimeout(tmRef.current);if(recRef.current)try{recRef.current.stop();}catch(e){};},[]);

  const showReward=m=>{
    setReward(m);setConfetti(true);AU.play('clear');
    if('speechSynthesis' in window){const msgs=["Great job!","You are amazing!","Perfect!","Magic!","Wonderful!"];const u=new SpeechSynthesisUtterance(msgs[Math.floor(Math.random()*msgs.length)]);u.lang='en-US';u.rate=1.1;u.pitch=1.5;window.speechSynthesis.speak(u);}
    setTimeout(()=>setConfetti(false),3500);
  };

  const setup=()=>{localStorage.setItem('wm_start',sDate);const pv=ELEM.split(',').map(p=>{const[en,zh]=p.split(':');return{en,zh};});const cv=sh(pv);localStorage.setItem('wm_vocab',JSON.stringify(cv));setVocab(cv);setRecs({});setPg('calendar');};

  const getWords=ds=>{
    if(!vocab.length)return[];
    const wd=wdiff(sDate,ds);const tw=Math.ceil(vocab.length/100)||1;
    const si=((wd%tw)+tw)%tw*100;let ww=[];for(let i=0;i<100;i++)ww.push(vocab[(si+i)%vocab.length]);
    const dow=new Date(ds).getDay();if(dow>=1&&dow<=5){const i=dow-1;return ww.slice(i*20,(i+1)*20);}return ww.slice(0,30);
  };

  const selDay=ds=>{setAdi({date:ds,isWE:new Date(ds).getDay()===0||new Date(ds).getDay()===6});setPool(getWords(ds));setPg('review');AU.init();};

  const startGame=m=>{
    if(m==='sentence'){
      const qs=buildSQ(pool);setSqList(qs);setSqI(0);setSqFb(null);setFillInp('');
      setWrongSq([]);setSqIsFirst(true);setFpSq(0);setSqInitN(qs.length);
      if(qs[0]?.type==='arrange'){setArrW(sh(qs[0].words));setArrA([]);}
      setMode('sentence');setPg('sentence');nextChar();return;
    }
    let tw=m==='comprehensive'?sh(recs[adi?.date]?.wrongWords||[]):sh([...pool]).slice(0,15);
    setWds(tw);setQi(0);setInitN(tw.length);setFp(0);setIsFirst(true);
    setFb(null);setWrongW([]);setRtTxt('');heardRef.current='';
    setMode(m);setPg(m);nextChar();AU.init();
  };

  const spk=(w,corr=false)=>{if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();window.cu=new SpeechSynthesisUtterance(w);window.cu.lang='en-US';window.cu.rate=corr?0.65:0.82;window.speechSynthesis.speak(window.cu);};

  useEffect(()=>{
    if((pg==='listening'||pg==='comprehensive')&&wds.length>0&&!fb){
      const cw=wds[qi];const wr=sh(vocab.filter(v=>v.en!==cw.en)).slice(0,3);
      setOpts(sh([cw,...wr]));spk(cw.en);
    }else if((pg==='dictation-en'||pg==='speaking'||pg==='dictation')&&wds.length>0&&!fb){
      if(pg==='dictation-en')spk(wds[qi].en);
      setRtTxt('');heardRef.current='';
    }
  },[qi,pg,wds,fb]);

  // ★ 推進下一題（答對1.2s自動，答錯手動點擊）
  const goNext=useCallback(()=>{
    if(tmRef.current)clearTimeout(tmRef.current);
    setFb(null);setInp('');setRtTxt('');heardRef.current='';
    nextChar();// ★ 換角色
    if(qi<wds.length-1){setQi(p=>p+1);}
    else if(wrongW.length>0){AU.play('fail');setNotif(`還有 ${wrongW.length} 個需複習 💪`);setWds(sh(wrongW));setQi(0);setWrongW([]);setIsFirst(false);}
    else{
      setRecs(prev=>{const nr={...prev};if(!nr[adi.date])nr[adi.date]={};if(mode==='comprehensive')nr[adi.date].comprehensiveDone=true;else{const pr=gR(nr[adi.date],mode);if(fp>=(pr?pr.correct:-1))nr[adi.date][mode]={correct:fp,total:initN};}localStorage.setItem('wm_rec',JSON.stringify(nr));return nr;});
      showReward(mode==='comprehensive'?'comprehensive':mode);setTimeout(()=>setPg('result'),100);
    }
  },[qi,wds,wrongW,fp,isFirst,mode,adi,initN,nextChar]);

  const handleAns=isOk=>{
    if(!isOk&&mode==='speaking')setTimeout(()=>spk(wds[qi]?.en,true),150);
    if(isOk&&isFirst)setFp(p=>p+1);
    if(!isOk&&isFirst&&adi&&mode!=='comprehensive'){
      const ds=adi.date;
      setRecs(prev=>{const nr={...prev};if(!nr[ds])nr[ds]={};if(!nr[ds].wrongWords)nr[ds].wrongWords=[];const cw=wds[qi];if(!nr[ds].wrongWords.some(x=>x.en===cw.en))nr[ds].wrongWords.push(cw);localStorage.setItem('wm_rec',JSON.stringify(nr));return nr;});
    }
    setFb(isOk?'correct':'incorrect');AU.play(isOk?'correct':'incorrect');
    if(!isOk){const cw=wds[qi];setWrongW(prev=>!prev.some(x=>x.en===cw.en)?[...prev,cw]:prev);}
    else{tmRef.current=setTimeout(goNext,1200);}
  };

  // ★ 句型推進
  const goSqNext=useCallback(()=>{
    if(tmRef.current)clearTimeout(tmRef.current);
    setSqFb(null);setFillInp('');nextChar();
    if(sqI<sqList.length-1){const ni=sqI+1;setSqI(ni);if(sqList[ni]?.type==='arrange'){setArrW(sh(sqList[ni].words));setArrA([]);}}
    else if(wrongSq.length>0){AU.play('fail');setNotif(`還有 ${wrongSq.length} 題需複習 💪`);const ns=sh(wrongSq);setSqList(ns);setSqI(0);setWrongSq([]);setSqIsFirst(false);if(ns[0]?.type==='arrange'){setArrW(sh(ns[0].words));setArrA([]);}}
    else{setRecs(prev=>{const nr={...prev};if(!nr[adi.date])nr[adi.date]={};nr[adi.date]['sentence']={correct:fpSq,total:sqInitN};localStorage.setItem('wm_rec',JSON.stringify(nr));return nr;});showReward('sentence');setTimeout(()=>setPg('result'),100);}
  },[sqI,sqList,wrongSq,fpSq,sqInitN,adi,nextChar]);

  const sqAns=isOk=>{
    AU.play(isOk?'correct':'incorrect');setSqFb(isOk?'correct':'incorrect');
    if(isOk&&sqIsFirst)setFpSq(p=>p+1);
    if(!isOk){const q=sqList[sqI];setSqWrong(p=>!p.some(x=>x.sentence===q.sentence)?[...p,q]:p);}
    else{tmRef.current=setTimeout(goSqNext,1200);}
  };
  // fix typo
  const setSqWrong=(fn)=>setWrongSq(fn);

  const handleSpeak=()=>{
    if(isRec){if(recRef.current)try{recRef.current.stop();}catch(e){}setIsRec(false);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setNotif('❌ 不支援語音！');return;}
    const r=new SR();recRef.current=r;r.lang='en-US';r.interimResults=true;r.maxAlternatives=8;
    let done=false;heardRef.current='';setRtTxt('🎙️ 聆聽中...');
    r.onstart=()=>{setIsRec(true);tmRef.current=setTimeout(()=>{if(!done){done=true;try{r.stop();}catch(e){}setIsRec(false);handleAns(isFuzzy(heardRef.current,wds[qi]?.en||''));}},10000);};
    r.onresult=ev=>{if(done)return;let lt='';const ans=wds[qi]?.en||'';for(let i=0;i<ev.results.length;i++){for(let j=0;j<ev.results[i].length;j++){const t=ev.results[i][j].transcript;if(i===ev.results.length-1&&j===0)lt=t;if(isFuzzy(t,ans)){done=true;try{r.stop();}catch(e){}setIsRec(false);handleAns(true);return;}}}setRtTxt(lt);heardRef.current=lt;};
    r.onerror=()=>{if(!done){done=true;setIsRec(false);handleAns(false);}};
    r.onend=()=>{if(!done){done=true;handleAns(isFuzzy(heardRef.current,wds[qi]?.en||''));}setIsRec(false);setTimeout(()=>setRtTxt(''),700);};
    try{r.start();}catch(e){setIsRec(false);}
  };

  // ── 全域 UI ──
  const GlobalUI=()=><>
    {confetti&&<Confetti/>}
    {reward&&<RewardPopup mode={reward} onClose={()=>setReward(null)}/>}
    {notif&&<div onClick={()=>setNotif('')} style={{position:'fixed',top:12,left:'50%',transform:'translateX(-50%)',background:'#2d2b36',color:'#fff',padding:'9px 18px',borderRadius:99,fontWeight:900,zIndex:400,fontSize:'0.82rem',boxShadow:'0 4px 14px rgba(0,0,0,0.28)',maxWidth:'86vw',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',cursor:'pointer'}}>{notif}</div>}
  </>;

  // ── 答題回饋遮罩 ──
  const FbOverlay=()=>{
    if(!fb)return null;const ok=fb==='correct';const cw=wds[qi];const C=Chars[qChar]||Chars.kuromi;
    return(
      <div style={{position:'absolute',inset:0,borderRadius:18,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,background:ok?'rgba(200,230,200,0.97)':'rgba(244,143,177,0.98)',zIndex:20,padding:16}}>
        {/* ★ 隨機角色登場 */}
        <div className={ok?'af':'aw'} style={{display:'inline-block'}}><C z={80}/></div>
        <div className={ok?'abi':'ash'} style={{textAlign:'center'}}>
          <div style={{fontSize:'3rem'}}>{ok?'🎉':'😿'}</div>
          <div style={{fontSize:'1.4rem',fontWeight:900,color:ok?'#2e7d32':'#880e4f'}}>{ok?'魔法成功！✨':'再試一次！'}</div>
          {!ok&&cw&&<div style={{marginTop:8,background:'rgba(0,0,0,0.12)',borderRadius:14,padding:'10px 18px',color:'#fff'}}>
            <div style={{fontSize:'0.8rem',fontWeight:700,opacity:0.85,marginBottom:3}}>正確答案：</div>
            <div style={{fontSize:'1.7rem',fontWeight:900}}>{cw.en}</div>
            <div style={{fontSize:'1rem',fontWeight:700,opacity:0.85}}>{cw.zh}</div>
          </div>}
        </div>
        {!ok&&<button onClick={goNext} className="btn ap" style={{background:'#fff',color:'#880e4f',padding:'8px 24px',fontSize:'0.95rem'}}>我記住了 → 繼續</button>}
      </div>
    );
  };

  // ── 句型回饋遮罩 ──
  const SqFbOverlay=({q})=>{
    if(!sqFb)return null;const ok=sqFb==='correct';const C=Chars[qChar]||Chars.melody;
    return(
      <div style={{position:'absolute',inset:0,borderRadius:18,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:10,background:ok?'rgba(200,230,200,0.97)':'rgba(244,143,177,0.98)',zIndex:20,padding:16}}>
        <div className={ok?'af':'aw'} style={{display:'inline-block'}}><C z={76}/></div>
        <div className={ok?'abi':'ash'} style={{textAlign:'center',width:'100%'}}>
          <div style={{fontSize:'2.8rem'}}>{ok?'🎉':'😿'}</div>
          <div style={{fontSize:'1.3rem',fontWeight:900,color:ok?'#2e7d32':'#880e4f',marginTop:4}}>{ok?'正確！太棒了！':'哎呀，再試試！'}</div>
          {!ok&&q&&<div style={{marginTop:8,background:'rgba(0,0,0,0.12)',borderRadius:14,padding:'10px 14px',color:'#fff',textAlign:'left',width:'90%',margin:'8px auto 0'}}>
            <div style={{fontSize:'0.75rem',fontWeight:700,color:'rgba(255,255,255,0.8)',marginBottom:3}}>✅ 正確答案：</div>
            <div style={{fontSize:'1.2rem',fontWeight:900,marginBottom:4}}>{q.type==='fill_blank'?q.blank:q.ans}</div>
            {q.tip&&<div style={{fontSize:'0.78rem',fontWeight:700,background:'rgba(0,0,0,0.1)',borderRadius:9,padding:'5px 9px'}}>💡 {q.tip}</div>}
          </div>}
          {ok&&q?.tip&&<div style={{fontSize:'0.78rem',fontWeight:700,background:'rgba(46,125,50,0.12)',borderRadius:9,padding:'6px 12px',marginTop:6,color:'#1b5e20'}}>💡 {q.tip}</div>}
        </div>
        {!ok&&<button onClick={goSqNext} className="btn ap" style={{background:'#fff',color:'#880e4f',padding:'8px 22px',fontSize:'0.9rem'}}>我記住了 → 繼續</button>}
      </div>
    );
  };

  // 進度條+題號
  const ProgHdr=({cur,tot,bg,tc})=>(
    <div style={{padding:'6px 14px 0',flexShrink:0}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
        <span style={{fontSize:'0.72rem',fontWeight:800,color:tc||'rgba(45,43,54,0.5)'}}>第 {cur} / {tot} 題</span>
        <span style={{fontSize:'0.72rem',fontWeight:800,color:tc||'rgba(45,43,54,0.4)'}}>✨ {mode==='sentence'?fpSq:fp} 分</span>
      </div>
      <div style={{background:'rgba(255,255,255,0.3)',borderRadius:99,height:9,overflow:'hidden'}}>
        <div className="pbar" style={{width:`${(cur/tot)*100}%`,height:'100%'}}/>
      </div>
    </div>
  );

  const GameHdr=(title,tc)=>(
    <div className="safe-t" style={{padding:'10px 14px 0',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
      <button onClick={()=>setPg('menu')} className="btn btn-ghost" style={{padding:'6px 12px',fontSize:'0.78rem'}}>← 返回</button>
      <span style={{fontWeight:900,fontSize:'0.95rem',color:tc||'#2d2b36'}}>{title}</span>
      <div style={{width:52}}/>
    </div>
  );

  // ══ SETUP ══
  if(pg==='setup')return(
    <div className="page safe-t safe-b" style={{background:'linear-gradient(160deg,#f3e5f5,#e8f5e9)',alignItems:'center',justifyContent:'center',padding:'20px 16px'}}>
      <GlobalUI/>
      <div style={{width:'100%',maxWidth:360,textAlign:'center'}}>
        <div className="af" style={{display:'inline-block',marginBottom:8}}><Chars.kuromi z={90}/></div>
        <h1 style={{fontSize:'1.8rem',fontWeight:900,color:'#2d2b36',marginBottom:4}}>魔法單字小達人</h1>
        <p style={{color:'#8e78a6',fontWeight:800,marginBottom:18,fontSize:'0.88rem'}}>三麗鷗 & 彩虹小馬陪你一起學英文！</p>
        <input type="date" value={sDate} onChange={e=>setSDate(e.target.value)} className="inp" style={{marginBottom:14}}/>
        <button onClick={setup} className="btn btn-dark" style={{width:'100%',padding:'13px',fontSize:'1.05rem'}}>開始魔法！🌸</button>
        {/* 側邊角色裝飾 */}
        <div style={{display:'flex',justifyContent:'center',gap:10,marginTop:16,opacity:0.7}}>
          {['melody','pochacco','cinnamoroll','hangyodon'].map((c,i)=>{const C=Chars[c];return C?<div key={i} style={{animation:`float ${3+i*0.5}s ease-in-out ${i*0.3}s infinite`}}><C z={36}/></div>:null;})}
        </div>
      </div>
    </div>
  );

  // ══ CALENDAR ══
  if(pg==='calendar'){
    const today=fd(new Date());const tO=new Date(today);tO.setHours(0,0,0,0);
    const sO=new Date(sDate);sO.setHours(0,0,0,0);
    const days=Array.from({length:30},(_,i)=>{const d=new Date(sO);d.setDate(d.getDate()+i);return fd(d);});
    const chCycle=[Chars.kuromi,Chars.melody,Chars.pochacco,Chars.cinnamoroll,Chars.hangyodon,Chars.rainbow,Chars.pinkie,Chars.twilight];
    return(
      <div className="page safe-t safe-b" style={{background:'#fdfbfd'}}>
        <GlobalUI/>
        <div style={{padding:'10px 14px 6px',background:'linear-gradient(135deg,#e1bee7,#f8bbd0)',flexShrink:0}}>
          <h1 style={{fontSize:'1.3rem',fontWeight:900,color:'#2d2b36',margin:0,textAlign:'center'}}>📅 30天魔法地圖</h1>
          <p style={{fontSize:'0.72rem',color:'#4a1c40',fontWeight:700,textAlign:'center',margin:'3px 0 0',opacity:0.7}}>每天完成 5 項測驗才算成功！</p>
        </div>
        <div className="scroll" style={{padding:'8px 10px'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
            {days.map((ds,di)=>{
              const dO=new Date(ds);dO.setHours(0,0,0,0);
              const isT=ds===today,isPast=dO<tO;
              const rec=recs[ds]||{};
              const allD=MODES.every(m=>gR(rec,m)!==null);
              const full=allD&&!(rec.wrongWords?.length>0&&!rec.comprehensiveDone);
              const CC=chCycle[di%chCycle.length];
              return(
                <div key={ds} onClick={()=>selDay(ds)}
                  style={{borderRadius:14,background:full?'#c8e6c9':isT?'#2d2b36':'rgba(225,190,231,0.18)',border:isT?'2px solid #f48fb1':'2px solid rgba(225,190,231,0.4)',padding:'9px 6px',textAlign:'center',cursor:'pointer',minHeight:86,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3}}>
                  <div style={{fontSize:'0.66rem',fontWeight:800,color:isT?'#f48fb1':isPast?'#999':'#8e78a6'}}>{ds.slice(5)}</div>
                  {full?<><div className="aw"><CC z={36}/></div><div style={{color:'#2e7d32',fontWeight:900,fontSize:'0.62rem'}}>完美✅</div></>
                    :isT?<><div className="af"><CC z={40}/></div><div style={{color:'#f48fb1',fontWeight:900,fontSize:'0.62rem'}}>今日✨</div></>
                    :isPast?<><div style={{opacity:0.4}}><CC z={32}/></div><div style={{color:'#e91e63',fontWeight:900,fontSize:'0.6rem'}}>補測</div></>
                    :<><div style={{opacity:0.15}}><CC z={30}/></div><div style={{color:'#ccc',fontSize:'0.6rem',fontWeight:700}}>未解鎖</div></>}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ══ REVIEW ══
  if(pg==='review')return(
    <div className="page safe-t safe-b" style={{background:'linear-gradient(160deg,#f3e5f5,#e8f5e9)'}}>
      <GlobalUI/>
      <div style={{padding:'10px 14px 6px',flexShrink:0,display:'flex',alignItems:'center',gap:8}}>
        <button onClick={()=>setPg('calendar')} className="btn btn-ghost" style={{padding:'6px 12px',fontSize:'0.78rem'}}>← 地圖</button>
        <div style={{flex:1,textAlign:'center',fontWeight:900,color:'#2d2b36',fontSize:'1.05rem'}}>先複習單字！</div>
        <div className="af2"><Chars.melody z={36}/></div>
      </div>
      <div className="scroll" style={{padding:'6px 12px'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
          {pool.map((w,i)=>(
            <div key={i} style={{background:'white',borderRadius:12,padding:'9px 10px',display:'flex',justifyContent:'space-between',alignItems:'center',boxShadow:'0 2px 6px rgba(225,190,231,0.28)'}}>
              <div><div style={{fontWeight:900,color:'#2d2b36',fontSize:'0.95rem'}}>{w.en}</div><div style={{color:'#8e78a6',fontSize:'0.75rem',fontWeight:700}}>{w.zh}</div></div>
              <button onClick={()=>spk(w.en)} style={{background:'#e1bee7',borderRadius:9,padding:'5px 7px',border:'none',color:'#4a1c40',fontWeight:900,fontSize:'0.82rem',cursor:'pointer'}}>🔊</button>
            </div>
          ))}
        </div>
      </div>
      <div style={{padding:'8px 12px',flexShrink:0,paddingBottom:'max(8px,env(safe-area-inset-bottom))'}}>
        <button onClick={()=>setPg('menu')} className="btn btn-dark" style={{width:'100%',padding:'13px',fontSize:'1rem'}}>進入測驗 →</button>
      </div>
    </div>
  );

  // ══ MENU ══
  if(pg==='menu'){
    const r=adi?(recs[adi.date]||{}):{};
    const modeInfo=[
      {k:'listening',ico:'🎵',title:'聽力魔法',bg:'#e3f2fd',tc:'#01579b',ch:'twilight'},
      {k:'dictation',ico:'✏️',title:'黑魔法拼字',bg:'#2d2b36',tc:'#fff',ch:'kuromi'},
      {k:'speaking',ico:'🎤',title:'音波攻擊',bg:'#e0f7fa',tc:'#006064',ch:'rainbow'},
      {k:'dictation-en',ico:'🎧',title:'派對聽寫',bg:'#fce4ec',tc:'#880e4f',ch:'pochacco'},
      {k:'sentence',ico:'📚',title:'語感之泉',bg:'#f3e5f5',tc:'#4a148c',ch:'melody'},
    ];
    return(
      <div className="page safe-t safe-b" style={{background:'#fdfbfd'}}>
        <GlobalUI/>
        <div style={{padding:'10px 14px 6px',flexShrink:0,display:'flex',alignItems:'center',gap:8}}>
          <button onClick={()=>setPg('review')} className="btn btn-dark" style={{padding:'6px 13px',fontSize:'0.78rem'}}>← 複習</button>
          <div style={{flex:1,textAlign:'center',fontWeight:900,color:'#2d2b36',fontSize:'1.05rem'}}>選擇試煉</div>
        </div>
        <div className="scroll" style={{padding:'6px 12px'}}>
          {/* 故事入口 */}
          <div style={{background:'linear-gradient(90deg,#e1bee7,#b3e5fc)',borderRadius:16,padding:'11px 14px',marginBottom:10,display:'flex',alignItems:'center',justifyContent:'space-between',boxShadow:'0 4px 12px rgba(225,190,231,0.3)'}}>
            <div>
              <div style={{fontWeight:900,color:'#3a1c4a',fontSize:'0.95rem'}}>📖 AI 魔法故事</div>
              <div style={{color:'#5c2b4a',fontWeight:700,fontSize:'0.72rem'}}>AI 生成有邏輯的英文故事，跟讀評分</div>
            </div>
            <button onClick={()=>setPg('story')} className="btn" style={{padding:'8px 14px',background:'#fff',color:'#8e78a6',fontSize:'0.82rem'}}>進入 →</button>
          </div>
          {/* 測驗按鈕格 */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {modeInfo.map(({k,ico,title,bg,tc,ch})=>{
              const done=gR(r,k)!==null;const C=Chars[ch];
              return(
                <button key={k} onClick={()=>startGame(k)} style={{background:bg,color:tc,padding:'13px 8px',borderRadius:18,border:`2px solid ${done?'rgba(255,255,255,0.6)':'transparent'}`,textAlign:'center',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,position:'relative',boxShadow:'0 4px 0 rgba(0,0,0,0.08)',transition:'all 0.14s',outline:'none'}}>
                  {done&&<div style={{position:'absolute',top:6,right:6,background:'rgba(255,255,255,0.85)',color:'#2e7d32',borderRadius:99,padding:'1px 6px',fontSize:'0.58rem',fontWeight:900}}>✅</div>}
                  <div className="af">{C?<C z={48}/>:null}</div>
                  <div style={{fontSize:'1rem'}}>{ico}</div>
                  <div style={{fontWeight:900,fontSize:'0.85rem'}}>{title}</div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ══ LISTENING / COMPREHENSIVE ══
  if(pg==='listening'||pg==='comprehensive'){const C=Chars[qChar]||Chars.kuromi;return(
    <div className="page safe-t safe-b" style={{background:'linear-gradient(160deg,#e3f2fd,#e1bee7)'}}>
      <GlobalUI/>
      {GameHdr(pg==='comprehensive'?'🏋️ 錯題練習':'🎵 聽力魔法','#01579b')}
      {ProgHdr({cur:qi+1,tot:wds.length,tc:'rgba(1,87,155,0.6)'})}
      <div className="scroll" style={{padding:'10px 14px'}}>
        <div style={{position:'relative',background:'white',borderRadius:18,padding:'16px',boxShadow:'0 4px 14px rgba(142,120,166,0.1)'}}>
          <FbOverlay/>
          {/* ★ 隨機角色裝飾 */}
          <div style={{display:'flex',justifyContent:'center',marginBottom:10}}><div className="af2"><C z={60}/></div></div>
          <div style={{textAlign:'center',marginBottom:14}}>
            <button onClick={()=>spk(wds[qi]?.en)} style={{width:76,height:76,borderRadius:'50%',background:'linear-gradient(135deg,#b3e5fc,#81d4fa)',border:'none',cursor:'pointer',fontSize:'2.2rem',boxShadow:'0 4px 14px rgba(129,212,250,0.4)'}}>🔊</button>
            <p style={{fontSize:'0.8rem',fontWeight:700,color:'#8e78a6',marginTop:8}}>請聽發音，選出正確中文</p>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {opts.map((o,i)=><button key={i} onClick={()=>{if(!fb)handleAns(o.en===wds[qi]?.en);}} disabled={!!fb} style={{background:'#f3e5f5',color:'#4a148c',padding:'14px 6px',borderRadius:14,fontWeight:900,fontSize:'0.95rem',border:'none',cursor:'pointer',boxShadow:'0 3px 0 rgba(0,0,0,0.07)'}}>{o.zh}</button>)}
          </div>
        </div>
      </div>
    </div>
  );}

  // ══ DICTATION / DICTATION-EN ══
  if(pg==='dictation'||pg==='dictation-en'){const C=Chars[qChar]||Chars.kuromi;const isEN=pg==='dictation-en';return(
    <div className="page safe-t safe-b" style={{background:isEN?'linear-gradient(160deg,#fce4ec,#f8bbd0)':'linear-gradient(160deg,#2d2b36,#3d2b4e)'}}>
      <GlobalUI/>
      {GameHdr(isEN?'🎧 派對聽寫':'✏️ 黑魔法拼字',isEN?'#880e4f':'#f48fb1')}
      {ProgHdr({cur:qi+1,tot:wds.length,tc:isEN?'rgba(136,14,79,0.6)':'rgba(244,143,177,0.6)'})}
      <div className="scroll" style={{padding:'10px 14px'}}>
        <div style={{position:'relative',background:isEN?'white':'rgba(255,255,255,0.07)',borderRadius:18,padding:'16px',border:`2px solid ${isEN?'rgba(225,190,231,0.4)':'rgba(244,143,177,0.2)'}`}}>
          <FbOverlay/>
          <div style={{display:'flex',justifyContent:'center',marginBottom:10}}><div className="af"><C z={60}/></div></div>
          <div style={{textAlign:'center',margin:'8px 0 16px'}}>
            {isEN?<button onClick={()=>spk(wds[qi]?.en)} style={{width:68,height:68,borderRadius:'50%',background:'linear-gradient(135deg,#f8bbd0,#f48fb1)',border:'none',cursor:'pointer',fontSize:'1.9rem',boxShadow:'0 4px 14px rgba(244,143,177,0.4)',marginBottom:8}}>🎧</button>
              :<div style={{fontSize:'2.2rem',fontWeight:900,color:'#fff'}}>{wds[qi]?.zh}</div>}
          </div>
          <form onSubmit={e=>{e.preventDefault();if(!fb&&inp.trim())handleAns(wds[qi]?.en.toLowerCase()===inp.trim().toLowerCase());}} style={{display:'flex',flexDirection:'column',gap:10}}>
            <input value={inp} onChange={e=>setInp(e.target.value)} disabled={!!fb} placeholder="輸入英文單字..." className="inp" autoFocus autoComplete="off" autoCorrect="off" autoCapitalize="off" style={{background:isEN?'':'rgba(255,255,255,0.1)',color:isEN?'':'#fff',borderColor:isEN?'#e1bee7':'rgba(244,143,177,0.4)'}}/>
            <button type="submit" disabled={!!fb||!inp} style={{padding:'12px',background:isEN?'linear-gradient(135deg,#f48fb1,#e91e8c)':'#f48fb1',color:'#fff',borderRadius:999,border:'none',fontWeight:900,fontSize:'0.95rem',cursor:'pointer',opacity:(!fb&&inp)?1:0.5}}>送出魔法 ✓</button>
          </form>
        </div>
      </div>
    </div>
  );}

  // ══ SPEAKING ══
  if(pg==='speaking'){const C=Chars[qChar]||Chars.rainbow;return(
    <div className="page safe-t safe-b" style={{background:'linear-gradient(160deg,#e0f7fa,#b2ebf2)'}}>
      <GlobalUI/>
      {GameHdr('🎤 音波攻擊','#006064')}
      {ProgHdr({cur:qi+1,tot:wds.length,tc:'rgba(0,96,100,0.6)'})}
      <div className="scroll" style={{padding:'10px 14px'}}>
        <div style={{position:'relative',background:'white',borderRadius:18,padding:'16px',textAlign:'center',boxShadow:'0 4px 14px rgba(0,0,0,0.06)'}}>
          <FbOverlay/>
          <div className="af" style={{display:'inline-block',marginBottom:8}}><C z={68}/></div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:10,margin:'4px 0'}}>
            <div style={{fontSize:'2.2rem',fontWeight:900,color:'#006064'}}>{wds[qi]?.en}</div>
            <button onClick={()=>spk(wds[qi]?.en)} style={{background:'#e0f7fa',border:'2px solid #b2ebf2',borderRadius:9,padding:'6px',cursor:'pointer',fontSize:'0.9rem',color:'#006064'}}>🔊</button>
          </div>
          <div style={{fontSize:'0.95rem',color:'#8e78a6',fontWeight:700,marginBottom:12}}>{wds[qi]?.zh}</div>
          <div style={{fontSize:'0.68rem',fontWeight:700,color:'rgba(0,96,100,0.5)',marginBottom:12,background:'rgba(0,188,212,0.07)',borderRadius:99,padding:'3px 12px',display:'inline-block'}}>發音接近即可通過 · 容錯已優化</div>
          <div style={{minHeight:34,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:14}}>
            {rtTxt?<span style={{background:'#e0f7fa',color:'#006064',padding:'5px 16px',borderRadius:99,fontWeight:800,fontSize:'0.88rem'}}>"{rtTxt}"</span>:<span style={{color:'rgba(0,96,100,0.35)',fontSize:'0.78rem'}}>等待語音輸入...</span>}
          </div>
          <button onClick={handleSpeak} disabled={!!fb} style={{width:88,height:88,borderRadius:'50%',background:isRec?'#f44336':'linear-gradient(135deg,#4dd0e1,#00bcd4)',border:'none',cursor:'pointer',fontSize:'2.5rem',boxShadow:isRec?'0 0 0 0 transparent':'0 5px 18px rgba(77,208,225,0.5)',animation:isRec?'pulse 1s ease infinite':'none',transition:'all 0.2s'}}>🎤</button>
          {isRec&&<div style={{marginTop:8,color:'#f44336',fontWeight:800,fontSize:'0.78rem'}}>錄音中... 點擊停止</div>}
        </div>
      </div>
    </div>
  );}

  // ══ SENTENCE ══
  if(pg==='sentence'){
    const q=sqList[sqI];if(!q)return null;
    const tLabel={fill_blank:'📝 填空',choice:'🔤 選擇',arrange:'🔀 排列'}[q.type]||'';
    return(
      <div className="page safe-t safe-b" style={{background:'linear-gradient(160deg,#f3e5f5,#ede7f6)'}}>
        <GlobalUI/>
        {GameHdr('📚 語感之泉','#4a148c')}
        <div style={{padding:'4px 14px 0',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{flex:1}}>{ProgHdr({cur:sqI+1,tot:sqList.length,tc:'rgba(74,20,140,0.55)'})}</div>
          <span style={{background:'#e1bee7',color:'#4a148c',borderRadius:99,padding:'3px 10px',fontSize:'0.7rem',fontWeight:900,flexShrink:0,marginLeft:8,marginTop:2}}>{tLabel}</span>
        </div>
        <div className="scroll" style={{padding:'8px 14px'}}>
          {/* 中文翻譯 */}
          <div style={{background:'rgba(255,255,255,0.72)',borderRadius:14,padding:'10px 14px',marginBottom:10,textAlign:'center',border:'2px solid rgba(225,190,231,0.45)'}}>
            <div style={{fontSize:'0.72rem',color:'#8e78a6',fontWeight:700,marginBottom:3}}>中文意思</div>
            <div style={{fontSize:'1rem',fontWeight:900,color:'#311b92',lineHeight:1.5}}>{q.translation}</div>
          </div>
          <div style={{position:'relative',background:'white',borderRadius:18,padding:'14px',boxShadow:'0 4px 12px rgba(0,0,0,0.06)'}}>
            <SqFbOverlay q={q}/>
            {/* 填空 */}
            {q.type==='fill_blank'&&<>
              <div style={{fontSize:'1.05rem',fontWeight:800,color:'#311b92',textAlign:'center',marginBottom:6,lineHeight:1.7}}>
                {q.sentence.split('___').map((p,i,a)=><span key={i}>{p}{i<a.length-1&&<span style={{display:'inline-block',width:60,borderBottom:'2.5px solid #8e78a6',margin:'0 4px',verticalAlign:'bottom'}}/>}</span>)}
              </div>
              <div style={{textAlign:'center',color:'#aaa',fontSize:'0.75rem',marginBottom:10,fontWeight:700}}>💡 {q.hint}</div>
              <form onSubmit={e=>{e.preventDefault();if(!sqFb&&fillInp.trim())sqAns(fillInp.trim().toLowerCase()===q.blank.toLowerCase());}} style={{display:'flex',flexDirection:'column',gap:8}}>
                <input value={fillInp} onChange={e=>setFillInp(e.target.value)} disabled={!!sqFb} placeholder="填入英文單字..." className="inp" autoFocus autoComplete="off" autoCorrect="off" autoCapitalize="off"/>
                <button type="submit" disabled={!!sqFb||!fillInp} style={{padding:'12px',background:'#311b92',color:'#fff',borderRadius:999,border:'none',fontWeight:900,fontSize:'0.92rem',cursor:'pointer',opacity:(!sqFb&&fillInp)?1:0.5}}>送出 ✓</button>
              </form>
            </>}
            {/* 選擇 */}
            {q.type==='choice'&&<>
              <div style={{fontSize:'1rem',fontWeight:800,color:'#311b92',textAlign:'center',marginBottom:14,lineHeight:1.6}}>{q.sentence}</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {q.opts.map((o,i)=><button key={i} onClick={()=>{if(!sqFb)sqAns(o===q.ans);}} disabled={!!sqFb} style={{background:'#f3e5f5',color:'#311b92',padding:'13px 6px',borderRadius:14,fontWeight:900,fontSize:'0.92rem',border:'none',cursor:'pointer',boxShadow:'0 3px 0 rgba(0,0,0,0.07)'}}>{o}</button>)}
              </div>
            </>}
            {/* 排列 */}
            {q.type==='arrange'&&<>
              <div style={{fontSize:'0.75rem',color:'#8e78a6',fontWeight:700,textAlign:'center',marginBottom:8}}>點擊或拖曳單字，排列成正確句子</div>
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();if(window.dragW){setArrW(p=>p.filter(x=>x!==window.dragW));setArrA(p=>[...p,window.dragW]);}}}
                style={{minHeight:46,background:'#ede7f6',borderRadius:12,padding:'7px 10px',marginBottom:8,display:'flex',flexWrap:'wrap',gap:6,border:'2px dashed rgba(142,120,166,0.3)',alignItems:'center'}}>
                {arrA.length===0&&<span style={{color:'rgba(74,20,140,0.3)',fontSize:'0.72rem',margin:'auto'}}>點擊下方單字放這裡</span>}
                {arrA.map((w,i)=><span key={i} onClick={()=>{setArrA(p=>p.filter(x=>x!==w));setArrW(p=>[...p,w]);}} style={{background:'#7e57c2',color:'#fff',padding:'6px 12px',borderRadius:10,fontWeight:900,cursor:'pointer',fontSize:'0.88rem'}}>{w}</span>)}
              </div>
              <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();if(window.dragW){setArrA(p=>p.filter(x=>x!==window.dragW));setArrW(p=>[...p,window.dragW]);}}}
                style={{minHeight:46,background:'#f5f0ff',borderRadius:12,padding:'7px 10px',marginBottom:10,display:'flex',flexWrap:'wrap',gap:6,alignItems:'center'}}>
                {arrW.map((w,i)=><span key={i} draggable onDragStart={()=>window.dragW=w} onClick={()=>{setArrW(p=>p.filter(x=>x!==w));setArrA(p=>[...p,w]);}} style={{background:'#fff',color:'#4a148c',padding:'6px 12px',borderRadius:10,fontWeight:900,cursor:'pointer',boxShadow:'0 2px 0 rgba(0,0,0,0.1)',fontSize:'0.88rem'}}>{w}</span>)}
                {arrW.length===0&&<span style={{color:'rgba(74,20,140,0.2)',fontSize:'0.72rem',margin:'auto'}}>所有單字已使用</span>}
              </div>
              <button onClick={()=>{if(!sqFb&&arrA.length)sqAns(arrA.join(' ').trim().toLowerCase()===q.ans.trim().toLowerCase());}} disabled={!!sqFb||!arrA.length} style={{width:'100%',padding:'12px',background:'#311b92',color:'#fff',borderRadius:999,border:'none',fontWeight:900,fontSize:'0.92rem',cursor:'pointer',opacity:(!sqFb&&arrA.length)?1:0.5}}>確認順序 ✓</button>
            </>}
          </div>
        </div>
      </div>
    );
  }

  // ══ RESULT ══
  if(pg==='result')return(
    <div className="page safe-t safe-b" style={{background:'linear-gradient(160deg,#fff9c4,#fff3e0)',alignItems:'center',justifyContent:'center',padding:'20px 16px'}}>
      <GlobalUI/>
      <div className="abi" style={{textAlign:'center',maxWidth:340,width:'100%'}}>
        <div style={{display:'flex',justifyContent:'center',gap:8,marginBottom:12}}>
          {sh(CHAR_LIST).slice(0,5).map((c,i)=>{const C=Chars[c];return C?<div key={i} style={{animation:`${i%2===0?'float':'float2'} ${3+i*0.4}s ease-in-out ${i*0.2}s infinite`}}><C z={44}/></div>:null;})}
        </div>
        <div style={{fontSize:'1.9rem',fontWeight:900,color:'#f57f17',marginBottom:6}}>測驗完成！🌟</div>
        <p style={{fontSize:'1.1rem',fontWeight:900,color:'#ffb300',marginBottom:4}}>答對 <span style={{fontSize:'2rem',color:'#e65100'}}>{mode==='sentence'?fpSq:fp}</span> / {mode==='sentence'?sqInitN:initN} 題</p>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
          <button onClick={()=>setPg('menu')} className="btn" style={{padding:'13px',background:'linear-gradient(135deg,#f57f17,#e65100)',color:'#fff',fontSize:'0.95rem',border:'none'}}>← 返回選單</button>
          <button onClick={()=>setPg('calendar')} className="btn btn-ghost" style={{padding:'11px',fontSize:'0.88rem'}}>回日曆地圖</button>
        </div>
      </div>
    </div>
  );

  // ══ STORY ══
  if(pg==='story')return(<><GlobalUI/><StoryReader wordPool={pool} onBack={()=>setPg('menu')} setNotif={setNotif}/></>);

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
