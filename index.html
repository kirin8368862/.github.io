// ══════════════════════════════════════════════
// 音效引擎
// ══════════════════════════════════════════════
const AudioEngine = (function(){
  let ctx=null, unlocked=false;
  function init(){
    try{
      if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)ctx=new C();}
      if(ctx&&ctx.state==='suspended')ctx.resume();
      if(ctx&&!unlocked){const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);unlocked=true;}
    }catch(e){}
  }
  function tone(freq,type,dur,vol=0.3){
    try{if(!ctx)return;const t=ctx.currentTime;const o=ctx.createOscillator();const g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur);}catch(e){}
  }
  return {
    init,
    play(type){
      init();
      if(type==='correct'){tone(659,'sine',0.12,0.4);setTimeout(()=>tone(880,'sine',0.12,0.4),100);setTimeout(()=>tone(1047,'sine',0.3,0.5),200);}
      else if(type==='incorrect'){tone(300,'sawtooth',0.15,0.35);setTimeout(()=>tone(220,'sawtooth',0.25,0.4),150);}
      else if(type==='clear'){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,'sine',0.15,0.4),i*80));setTimeout(()=>{tone(1047,'sine',0.6,0.6);tone(784,'sine',0.6,0.6);},420);}
      else if(type==='fail'){tone(392,'triangle',0.2,0.35);setTimeout(()=>tone(330,'triangle',0.4,0.4),200);}
    }
  };
})();

// ══════════════════════════════════════════════
// 口說辨識 (中等容錯)
// ══════════════════════════════════════════════
const getLev=(a,b)=>{
  const dp=Array.from({length:b.length+1},(_,i)=>[i]);
  for(let j=0;j<=a.length;j++)dp[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)dp[i][j]=b[i-1]===a[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j-1],dp[i][j-1],dp[i-1][j]);
  return dp[b.length][a.length];
};
const SOUND={'ph':'f','ck':'k','gh':'g','kn':'n','wr':'r','mb':'m','wh':'w','qu':'kw'};
const normS=(s)=>{let r=s.toLowerCase().trim();Object.entries(SOUND).forEach(([f,t])=>{r=r.replaceAll(f,t);});return r;};
const isFuzzy=(spoken,target)=>{
  let cs=spoken.toLowerCase().replace(/[^a-z0-9 ]/g,'');
  const ct=target.toLowerCase().replace(/[^a-z ]/g,'').trim();
  const nt=normS(ct);
  const words=cs.split(/\s+/);
  if(cs.includes(ct)||cs.includes(nt))return true;
  for(let w of words){
    if(!w)continue;
    const nw=normS(w);
    if(w===ct||nw===nt)return true;
    const len=ct.length;
    const thr=len<=3?1:len<=5?1:len<=7?2:len<=10?3:4;
    if(Math.min(getLev(w,ct),getLev(nw,nt))<=thr)return true;
  }
  return cs.replace(/\s/g,'').includes(ct);
};

// ══════════════════════════════════════════════
// 彩帶特效
// ══════════════════════════════════════════════
function Confetti(){
  const colors=['#f48fb1','#b3e5fc','#fff9c4','#e1bee7','#c8e6c9','#2d2b36'];
  const pieces = Array.from({length:60},(_,i)=>({
    id:i, color:colors[i%colors.length], left:`${Math.random()*100}vw`, delay:`${Math.random()*1.5}s`, dur:`${2+Math.random()*2}s`, size:`${6+Math.random()*10}px`, shape: Math.random()>0.5?'50%':'4px',
  }));
  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:999,overflow:'hidden'}}>
      {pieces.map(p=>(
        <div key={p.id} className="confetti-piece" style={{left:p.left, backgroundColor:p.color, width:p.size, height:p.size, borderRadius:p.shape, animationDuration:p.dur, animationDelay:p.delay}}/>
      ))}
    </div>
  );
}

  { type:'arrange', words_template:['lunch','I','eat','at','noon'], answer_template:'I eat lunch at noon', translation:'我在中午吃午餐。', grammar_tip:'時間副詞 at noon 放在句子最後' },
  { type:'arrange', words_template:['my','I','sister','love'], answer_template:'I love my sister', translation:'我愛我的姊姊。', grammar_tip:'主詞 + 動詞 + 受詞' },
  { type:'arrange', words_template:['are','playing','They','basketball'], answer_template:'They are playing basketball', translation:'他們正在打籃球。', grammar_tip:'主詞 + be動詞 + V-ing + 受詞' },
];

function buildSentenceQuestions(wordPool) {
  const shuffle=(a)=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
  const animals=wordPool.filter(w=>['cat','dog','bird','fish','rabbit','hamster','horse','monkey','elephant','tiger','lion','bear','duck','pig','goat','sheep','turtle','snake','frog'].includes(w.en));
  const adjectives=wordPool.filter(w=>['happy','sad','big','small','tall','short','hot','cold','fast','slow','clean','dirty','beautiful','ugly','funny','tired','hungry','angry','brave','cute','smart'].includes(w.en));
  const verbs=wordPool.filter(w=>['run','swim','jump','sing','dance','draw','read','write','play','cook','eat','drink','sleep','study','walk','ride','fly','laugh','cry'].includes(w.en));
  const things=wordPool.filter(w=>['book','pen','ball','bag','key','hat','cup','phone','computer','clock','desk','chair','door','window'].includes(w.en));

  const pick=(arr)=>arr.length?arr[Math.floor(Math.random()*arr.length)]:null;
  const selected = shuffle(SENTENCE_TEMPLATES).slice(0,6);
  return selected.map(tpl=>{
    if(tpl.type==='fill_blank'){
      let word=null;
      if(tpl.word_tag==='animal_pet') word=pick(animals)||pick(wordPool);
      else if(tpl.word_tag==='adj') word=pick(adjectives)||pick(wordPool);
      else if(tpl.word_tag==='verb_activity') word=pick(verbs)||pick(wordPool);
      else word=pick(things)||pick(wordPool);
      if(!word) word={en:'cat',zh:'貓'};
      return { type:'fill_blank', sentence:tpl.template.replace('___',`___`), blank_word:word.en, blank_word_zh:word.zh, hint:`中文：「${word.zh}」`, translation:tpl.zh_template.replace('___',`(${word.zh})`), grammar_tip:tpl.grammar_tip };
    } else if(tpl.type==='choice') {
      return { type:'choice', ...tpl };
    } else {
      return { type:'arrange', words:shuffle(tpl.words_template), answer:tpl.answer_template, translation:tpl.translation, grammar_tip:tpl.grammar_tip };
    }
  });
}

function StoryReader({ wordsPool, onBack }) {
  const [storyEn, setStoryEn] = useState('');
  const [storyZh, setStoryZh] = useState('');
  const [isPlaying, setIsPlaying] = useState(false);

  useEffect(() => {
    const shuffle=(a)=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
    const ws = shuffle(wordsPool).slice(0, 5);
    while(ws.length < 5) ws.push({en:'magic', zh:'魔法'}); // fallback
    
    const en = `Hello! Kuromi and Pinkie Pie went on an adventure today. They found a beautiful ${ws[0].en}. Kuromi said, "I really like this ${ws[0].en}!" Then, they saw a ${ws[1].en} and a ${ws[2].en}. They wanted to use them to ${ws[3].en}. It made everyone feel very ${ws[4].en}. What a magical day with friends!`;
    
    const zh = `你好！酷洛米和碧琪今天去冒險了。她們找到了一個美麗的「${ws[0].zh}」。酷洛米說：「我真的很喜歡這個${ws[0].zh}！」接著，她們看到了一個「${ws[1].zh}」和一個「${ws[2].zh}」。她們想要用它們來「${ws[3].zh}」。這讓每個人都覺得非常「${ws[4].zh}」。和朋友在一起真是充滿魔法的一天！`;
    
    setStoryEn(en);
    setStoryZh(zh);
  }, [wordsPool]);

  const toggleSpeak = () => {
    if(!('speechSynthesis' in window)) return alert('不支援語音功能');
    if(isPlaying) {
      window.speechSynthesis.cancel();
      setIsPlaying(false);
    } else {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(storyEn);
      u.lang = 'en-US';
      u.rate = 0.85;
      u.onend = () => setIsPlaying(false);
      setIsPlaying(true);
      window.speechSynthesis.speak(u);
    }
  };

  useEffect(()=>{ return ()=>window.speechSynthesis.cancel(); },[]);

  return (
    <div className="kawaii-card animate-slide-up" style={{padding:32, width:'100%', maxWidth:600, textAlign:'center'}}>
      <h2 style={{fontSize:'1.8rem', fontWeight:900, color:'var(--kuromi-dark)', marginBottom:16}}>📖 魔法小故事</h2>
      <p style={{color:'#666', fontWeight:700, marginBottom:20}}>我們把今天的單字變成故事囉！</p>
      
      <div style={{background: 'linear-gradient(135deg, #e1bee7, #f8bbd0)', borderRadius:20, padding:24, marginBottom:20, boxShadow:'0 4px 15px rgba(225,190,231,0.5)', position:'relative'}}>
        <div style={{position:'absolute', top:-20, right:-10, transform:'scale(0.6)'}}>{Characters.twilight(100)}</div>
        <p style={{fontSize:'1.1rem', fontWeight:800, color:'#3a1c4a', lineHeight:1.6, textAlign:'left', marginBottom:16}}>{storyEn}</p>
        <p style={{fontSize:'1rem', fontWeight:700, color:'#5c2b4a', lineHeight:1.5, textAlign:'left', borderTop:'2px dashed rgba(255,255,255,0.5)', paddingTop:12}}>{storyZh}</p>
      </div>

      <div style={{display:'flex', gap:16, justifyContent:'center'}}>
        <button className="candy-btn" onClick={toggleSpeak} style={{padding:'12px 24px', background:isPlaying?'#f44336':'#81d4fa', color:isPlaying?'#fff':'#111', fontSize:'1rem'}}>
          {isPlaying ? '⏹️ 停止朗讀' : '🔊 英文朗讀'}
        </button>
        <button className="candy-btn" onClick={onBack} style={{padding:'12px 24px', background:'#2d2b36', color:'#fff', fontSize:'1rem'}}>
          返回選單
        </button>
      </div>
    </div>
  );
}

function App(){
  const [st, setSt]=useState('setup');
  const [lv, setLv]=useState('elementary');
  const [sDate, setSDate]=useState('');
  const [vocab, setVocab]=useState([]);
  const [records, setRecords]=useState({});
  const [activeDI, setActiveDI]=useState(null);
  const [wordsPool, setWordsPool]=useState([]);
  const [testMode, setTestMode]=useState(null);
  const [words, setWords]=useState([]);
  const [idx, setIdx]=useState(0);
  const [initCount, setInitCount]=useState(0);
  const [fpCorrect, setFpCorrect]=useState(0);
  const [isFirstPass, setIsFirstPass]=useState(true);
  const [feedback, setFeedback]=useState(null);
  const [notif, setNotif]=useState('');
  const [wrongW, setWrongW]=useState([]);
  const [opts, setOpts]=useState([]);
  const [inp, setInp]=useState('');
  const [isRec, setIsRec]=useState(false);
  const [rtText, setRtText]=useState('');
  const [charPopup, setCharPopup]=useState(null);
  const [showConfetti, setShowConfetti]=useState(false);
  
  // 句型
  const [sqList, setSqList]=useState([]);
  const [sqIdx, setSqIdx]=useState(0);
  const [sqScore, setSqScore]=useState(0);
  const [sqFb, setSqFb]=useState(null);
  const [fillInp, setFillInp]=useState('');
  const [arrWords, setArrWords]=useState([]);
  const [arrAns, setArrAns]=useState([]);

  const recRef=useRef(null);
  const tmRef=useRef(null);
  const heardRef=useRef('');

  useEffect(()=>{
    const fmtDate=(d)=>{const dt=new Date(d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
    const sl=localStorage.getItem('wm_level')||'elementary';
    setLv(sl);
    const ss=localStorage.getItem('wm_start');
    const sr=localStorage.getItem('wm_rec');
    const sv=localStorage.getItem('wm_vocab');
    const pv=ELEM.split(',').map(p=>{const[en,zh]=p.split(':');return{en,zh};});
    if(sv)setVocab(JSON.parse(sv));
    else{const s=[...pv].sort(()=>Math.random()-0.5);setVocab(s);localStorage.setItem('wm_vocab',JSON.stringify(s));}
    if(sr)setRecords(JSON.parse(sr));
    if(ss&&ss!=='undefined'&&ss!=='null'){setSDate(ss);setSt('calendar');}
    else{setSDate(fmtDate(new Date()));setSt('setup');}
  },[]);

  const fmtDate=(d)=>{const dt=new Date(d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
  const weekDiff=(s,t)=>{const sd=new Date(s);sd.setHours(0,0,0,0);const sD=sd.getDay()||7;sd.setDate(sd.getDate()-sD+1);const td=new Date(t);td.setHours(0,0,0,0);const tD=td.getDay()||7;td.setDate(td.getDate()-tD+1);return Math.max(0,Math.round((td-sd)/(86400000*7)));};
  const getRec=(rec,mode)=>{if(!rec||rec[mode]===undefined)return null;if(typeof rec[mode]==='number')return{correct:rec[mode]/10,total:rec[mode]/10};return rec[mode];};
  const MODES=['listening','dictation','speaking','dictation-en','sentence'];
  const dayScore=(rec)=>{if(!rec)return 0;let tc=0,tq=0,cc=0;MODES.forEach(m=>{const r=getRec(rec,m);if(r){tc+=r.correct;tq+=r.total;cc++;}});if(!tq)return 0;return Math.round((tc/tq)*(cc*20));};

  const showCharReward=(mode)=>{
    setCharPopup(mode);
    setShowConfetti(true);
    AudioEngine.play('clear');
    setTimeout(()=>setShowConfetti(false),3500);
  };

  const handleSetup=()=>{
    localStorage.setItem('wm_level',lv);
    localStorage.setItem('wm_start',sDate);
    const pv=ELEM.split(',').map(p=>{const[en,zh]=p.split(':');return{en,zh};});
    const cv=[...pv].sort(()=>Math.random()-0.5);
    localStorage.setItem('wm_vocab',JSON.stringify(cv));
    setVocab(cv); setRecords({});
    setSt('calendar'); AudioEngine.init();
  };

  const getWords=(ds)=>{
    if(!vocab.length)return[];
    const wd=weekDiff(sDate,ds);
    const tw=Math.ceil(vocab.length/100)||1;
    const si=((wd%tw)+tw)%tw*100;
    let ww=[];for(let i=0;i<100;i++)ww.push(vocab[(si+i)%vocab.length]);
    const dow=new Date(ds).getDay();
    if(dow>=1&&dow<=5){const i=dow-1;return ww.slice(i*20,(i+1)*20);}
    return ww.slice(0,30);
  };

  const selectDay=(ds)=>{
    const w=getWords(ds);
    setActiveDI({date:ds,isWE:new Date(ds).getDay()===0||new Date(ds).getDay()===6});
    setWordsPool(w);setSt('review');AudioEngine.init();
  };

  const startGame=(mode)=>{
    if(mode==='sentence'){
      const qs=buildSentenceQuestions(wordsPool);
      setSqList(qs);setSqIdx(0);setSqScore(0);setSqFb(null);setFillInp('');
      if(qs[0]?.type==='arrange'){setArrWords([...qs[0].words].sort(()=>Math.random()-0.5));setArrAns([]);}
      setTestMode('sentence');setSt('sentence');
      return;
    }
    let tw=[];
    if(mode==='comprehensive')tw=[...(records[activeDI.date]?.wrongWords||[])].sort(()=>Math.random()-0.5);
    else tw=[...wordsPool].sort(()=>Math.random()-0.5).slice(0,15);
    setWords(tw);setIdx(0);setInitCount(tw.length);setFpCorrect(0);setIsFirstPass(true);
    setFeedback(null);setWrongW([]);setRtText('');heardRef.current='';
    setTestMode(mode);setSt(mode);AudioEngine.init();
  };

  const speakW=(w,corr=false)=>{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      window.cu=new SpeechSynthesisUtterance(w);
      window.cu.lang='en-US';window.cu.rate=corr?0.65:0.82;
      window.speechSynthesis.speak(window.cu);
    }
  };

  useEffect(()=>{
    if((st==='listening'||st==='comprehensive')&&words.length>0&&!feedback){
      const cw=words[idx];
      const wr=[...vocab.filter(v=>v.en!==cw.en)].sort(()=>Math.random()-0.5).slice(0,3);
      setOpts([cw,...wr].sort(()=>Math.random()-0.5));speakW(cw.en);
    }else if((st==='dictation-en'||st==='speaking'||st==='dictation')&&words.length>0&&!feedback){
      if(st==='dictation-en')speakW(words[idx].en);
      setRtText('');heardRef.current='';
    }
  },[idx,st,words,feedback]);

  const handleAns=(isOk)=>{
    let uw=[...wrongW];
    if(!isOk&&testMode==='speaking')setTimeout(()=>speakW(words[idx].en,true),150);
    let nc=fpCorrect;
    if(isOk&&isFirstPass){nc+=1;setFpCorrect(nc);}
    if(!isOk&&isFirstPass&&activeDI&&testMode!=='comprehensive'){
      const ds=activeDI.date;
      setRecords(prev=>{
        const nr={...prev};if(!nr[ds])nr[ds]={};if(!nr[ds].wrongWords)nr[ds].wrongWords=[];
        const cw=words[idx];if(!nr[ds].wrongWords.some(x=>x.en===cw.en))nr[ds].wrongWords.push(cw);
        localStorage.setItem('wm_rec',JSON.stringify(nr));return nr;
      });
    }
    setFeedback(isOk?'correct':'incorrect');
    AudioEngine.play(isOk?'correct':'incorrect');
    if(!isOk){const cw=words[idx];if(!uw.some(x=>x.en===cw.en)){uw.push(cw);setWrongW(uw);}}
    
    setTimeout(()=>{
      if(idx<words.length-1){setIdx(p=>p+1);setFeedback(null);setInp('');}
      else{
        if(uw.length>0){
          AudioEngine.play('fail'); setNotif(`還有 ${uw.length} 個單字需要複習喔！💪`);
          setWords(uw.sort(()=>Math.random()-0.5));setIdx(0);setWrongW([]);setIsFirstPass(false);setFeedback(null);setInp('');
        }else{
          setRecords(prev=>{
            const nr={...prev};if(!nr[activeDI.date])nr[activeDI.date]={};
            if(testMode==='comprehensive')nr[activeDI.date].comprehensiveDone=true;
            else{const pr=getRec(nr[activeDI.date],testMode);const pc=pr?pr.correct:-1;if(nc>=pc)nr[activeDI.date][testMode]={correct:nc,total:initCount};}
            localStorage.setItem('wm_rec',JSON.stringify(nr));return nr;
          });
          showCharReward(testMode==='comprehensive'?'comprehensive':testMode);
          setFeedback(null);setInp('');
          setTimeout(()=>setSt('result'),100);
        }
      }
    },1800);
  };

  const sqNext=(isOk)=>{
    AudioEngine.play(isOk?'correct':'incorrect');
    setSqFb(isOk?'correct':'incorrect');
    const ns=isOk?sqScore+1:sqScore; setSqScore(ns);
    setTimeout(()=>{
      setSqFb(null);setFillInp('');
      if(sqIdx<sqList.length-1){
        const ni=sqIdx+1;setSqIdx(ni);
        if(sqList[ni]?.type==='arrange'){setArrWords([...sqList[ni].words].sort(()=>Math.random()-0.5));setArrAns([]);}
      }else{
        setRecords(prev=>{
          const nr={...prev};if(!nr[activeDI.date])nr[activeDI.date]={};
          nr[activeDI.date]['sentence']={correct:ns,total:sqList.length};
          localStorage.setItem('wm_rec',JSON.stringify(nr));return nr;
        });
        setFpCorrect(ns);setInitCount(sqList.length);
        showCharReward('sentence');
        setTimeout(()=>setSt('result'),100);
      }
    },2000);
  };

  const handleSpeak=()=>{
    if(isRec){if(recRef.current)recRef.current.stop();setIsRec(false);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setNotif('❌ 不支援語音輸入！');return;}
    const r=new SR();recRef.current=r;r.lang='en-US';r.interimResults=true;
    let done=false;heardRef.current='';setRtText('🎙️ 聆聽中...');
    r.onstart=()=>{setIsRec(true);tmRef.current=setTimeout(()=>{if(!done){done=true;r.stop();setIsRec(false);handleAns(isFuzzy(heardRef.current,words[idx]?.en||''));}},8000);};
    r.onresult=(ev)=>{if(done)return;let lt='';const ans=words[idx]?.en||'';
      for(let i=0;i<ev.results.length;i++){for(let j=0;j<ev.results[i].length;j++){lt=ev.results[i][j].transcript;if(isFuzzy(lt,ans)){done=true;r.stop();handleAns(true);return;}}}
      setRtText(lt);heardRef.current=lt;
    };
    r.onerror=()=>{if(!done){done=true;r.stop();handleAns(false);setIsRec(false);}};
    r.onend=()=>{if(!done){done=true;handleAns(isFuzzy(heardRef.current,words[idx]?.en||''));}setIsRec(false);};
    try{r.start();}catch(e){setIsRec(false);}
  };

  // ────────── 渲染區 ──────────
  const rGameHdr=(title,bgGrad,textColor)=>(
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',width:'100%',maxWidth:700,marginBottom:28}}>
      <button className="candy-btn" onClick={()=>setSt('menu')} style={{padding:'10px 20px',background:bgGrad,color:textColor,fontSize:'0.9rem'}}>← 返回</button>
      <div style={{background:bgGrad,padding:'8px 24px',borderRadius:99,color:textColor,fontWeight:900,fontSize:'1.1rem'}}>{title}</div>
      <div style={{background:bgGrad,padding:'8px 18px',borderRadius:99,color:textColor,fontWeight:900,fontSize:'0.9rem'}}>✨ 分數: {testMode==='sentence'?sqScore:fpCorrect}</div>
    </div>
  );

  const rFb=()=>{if(!feedback)return null;const ok=feedback==='correct';const cw=words[idx];
    return(<div style={{position:'absolute',inset:0,borderRadius:28,display:'flex',alignItems:'center',justifyContent:'center',background:ok?'rgba(200,230,201,0.95)':'rgba(244,143,177,0.95)',zIndex:20}}>
      <div className={ok?'animate-bounce-in':'animate-shake'} style={{textAlign:'center'}}>
        <div style={{fontSize:'5rem'}}>{ok?'🎉':'😿'}</div>
        <div style={{fontSize:'1.8rem',fontWeight:900,color:ok?'#2e7d32':'#880e4f',marginTop:12}}>{ok?'魔法成功！':'哎呀，差一點！'}</div>
        {!ok&&<div style={{marginTop:8,fontWeight:700,color:'#fff'}}>正確答案：<span style={{fontWeight:900}}>{cw?.en}</span></div>}
      </div>
    </div>);
  };

  // SETUP
  const rSetup=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:40,maxWidth:420,width:'100%',textAlign:'center'}}>
      <div className="animate-float">{Characters.kuromi(120)}</div>
      <h1 style={{fontSize:'2.2rem',fontWeight:900,color:'#2d2b36',marginTop:16}}>魔法單字達人</h1>
      <p style={{color:'#8e78a6',fontWeight:800,marginBottom:28}}>酷洛米與彩虹小馬的學習派對！</p>
      <label style={{display:'block',fontWeight:900,color:'#2d2b36',marginBottom:12}}>📅 選擇魔法啟動日</label>
      <input type="date" value={sDate} onChange={e=>setSDate(e.target.value)} className="kawaii-input" style={{marginBottom:24}}/>
      <button className="candy-btn" onClick={handleSetup} style={{width:'100%',padding:'18px',background:'#2d2b36',color:'#fff',fontSize:'1.2rem'}}>開始挑戰！🌸</button>
    </div>
  );

  // CALENDAR
  const rCal=()=>{
    const today=fmtDate(new Date());const todayObj=new Date(today);todayObj.setHours(0,0,0,0);
    const startObj=new Date(sDate);startObj.setHours(0,0,0,0);
    const days=Array.from({length:30},(_,i)=>{const d=new Date(startObj);d.setDate(d.getDate()+i);return fmtDate(d);});
    return(
      <div style={{width:'100%',maxWidth:900}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <h1 style={{fontSize:'2.5rem',fontWeight:900,color:'#2d2b36'}}>📅 30天魔法地圖</h1>
          <p style={{color:'#666',fontWeight:700}}>完成每日 5 項測驗解鎖魔法！</p>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:16}}>
          {days.map((ds,di)=>{
            const dObj=new Date(ds);dObj.setHours(0,0,0,0);
            const isToday=ds===today;const isPast=dObj<todayObj;
            const rec=records[ds]||{};
            const allDone=MODES.every(m=>getRec(rec,m)!==null);
            const full=allDone&&!(rec.wrongWords?.length>0&&!rec.comprehensiveDone);
            return(
              <div key={ds} onClick={()=>{if(!full||isToday||dObj>todayObj)selectDay(ds);}}
                style={{borderRadius:24,background:full?'#c8e6c9':isToday?'#2d2b36':'#fff',border:isToday?'3px solid #f48fb1':'3px solid #e1bee7',padding:'16px 12px',textAlign:'center',cursor:'pointer',transform:isToday?'translateY(-4px)':'none'}}>
                <div style={{fontSize:'0.8rem',fontWeight:800,color:isToday?'#fff':'#888',marginBottom:8}}>{ds.slice(5)}</div>
                {full?<><div className="animate-wiggle">{Characters.pinkie(50)}</div><div style={{color:'#2e7d32',fontWeight:900,marginTop:4,fontSize:'0.8rem'}}>完美通關</div></>
                  :isToday?<><div className="animate-float">{Characters.kuromi(50)}</div><div style={{color:'#f48fb1',fontWeight:900,marginTop:4,fontSize:'0.8rem'}}>今日任務</div></>
                  :isPast?<><div style={{opacity:0.5}}>{Characters.twilight(50)}</div><div style={{color:'#e91e63',fontWeight:900,marginTop:4,fontSize:'0.8rem'}}>點此補測</div></>
                  :<div style={{opacity:0.3,color:'#ccc',fontWeight:900,marginTop:20}}>未解鎖</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // REVIEW
  const rReview=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:28,width:'100%',maxWidth:800}}>
      <button onClick={()=>setSt('calendar')} style={{background:'none',border:'none',color:'#8e78a6',fontWeight:900,cursor:'pointer',marginBottom:16}}>← 返回地圖</button>
      <div style={{textAlign:'center',marginBottom:20}}>
        <div className="animate-float">{Characters.melody(80)}</div>
        <h2 style={{fontSize:'1.8rem',fontWeight:900,color:'#2d2b36'}}>先複習魔法單字！</h2>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10,maxHeight:'40vh',overflowY:'auto',padding:8,background:'#f3e5f5',borderRadius:20,marginBottom:20}}>
        {wordsPool.map((w,i)=>(
          <div key={i} style={{background:'white',borderRadius:16,padding:'12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div><div style={{fontWeight:900,color:'#2d2b36'}}>{w.en}</div><div style={{color:'#888',fontSize:'0.85rem'}}>{w.zh}</div></div>
            <button onClick={()=>speakW(w.en)} style={{background:'#e1bee7',borderRadius:12,padding:'8px',border:'none',color:'#4a1c40'}}>🔊</button>
          </div>
        ))}
      </div>
      <button className="candy-btn" onClick={()=>setSt('menu')} style={{width:'100%',padding:'16px',background:'#2d2b36',color:'white',fontSize:'1.15rem'}}>準備好了！進入測驗 →</button>
    </div>
  );

  // MENU
  const rMenu=()=>{
    const r=activeDI?(records[activeDI.date]||{}):{};
    const modeInfo=[
      {k:'listening',icon:'🎵',title:'聽力魔法',desc:'聽音選中',bg:'#b3e5fc',tc:'#01579b',c:Characters.twilight},
      {k:'dictation',icon:'✏️',title:'黑魔法拼字',desc:'看中拼英',bg:'#2d2b36',tc:'#ffffff',c:Characters.kuromi},
      {k:'speaking',icon:'🎤',title:'音波攻擊',desc:'口說挑戰',bg:'#81d4fa',tc:'#01579b',c:Characters.rainbow},
      {k:'dictation-en',icon:'🎧',title:'派對聽寫',desc:'聽音拼寫',bg:'#f8bbd0',tc:'#880e4f',c:Characters.pinkie},
      {k:'sentence',icon:'📚',title:'語感之泉',desc:'句型文法',bg:'#e1bee7',tc:'#4a1c40',c:Characters.melody},
    ];
    return(
      <div style={{width:'100%',maxWidth:800}}>
        <button onClick={()=>setSt('review')} style={{background:'#2d2b36',border:'none',borderRadius:99,padding:'8px 20px',color:'white',fontWeight:800,marginBottom:16}}>← 複習單字</button>
        <div style={{textAlign:'center',marginBottom:24}}><h2 style={{fontSize:'2rem',fontWeight:900,color:'#2d2b36'}}>選擇你的試煉</h2></div>
        
        {/* 單字故事機入口 */}
        <div style={{background:'linear-gradient(90deg, #b3e5fc, #e1bee7, #f8bbd0)', borderRadius:24, padding:'20px', marginBottom:20, display:'flex', justifyContent:'space-between', alignItems:'center', boxShadow:'0 6px 15px rgba(225,190,231,0.5)'}}>
          <div style={{textAlign:'left'}}>
            <h3 style={{margin:0, color:'#3a1c4a', fontWeight:900, fontSize:'1.4rem'}}>📖 魔法故事時間</h3>
            <p style={{margin:0, color:'#5c2b4a', fontWeight:700, fontSize:'0.9rem'}}>用今天的單字聽故事吧！</p>
          </div>
          <button className="candy-btn" onClick={()=>setSt('story')} style={{padding:'12px 24px', background:'#fff', color:'#3a1c4a', fontSize:'1rem'}}>進入故事 →</button>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:16}}>
          {modeInfo.map(({k,icon,title,desc,bg,tc,c:CC})=>{
            const done=getRec(r,k)!==null;
            return(
              <button key={k} onClick={()=>startGame(k)} className="candy-btn" style={{background:bg,color:tc,padding:'20px',textAlign:'center',border:`4px solid ${done?'#fff':'transparent'}`,opacity:done?0.8:1}}>
                {done&&<div style={{position:'absolute',top:8,right:8,background:'#fff',color:tc,borderRadius:99,padding:'4px 8px',fontSize:'0.7rem'}}>已完成</div>}
                <div className="animate-float" style={{marginBottom:8}}><CC size={60}/></div>
                <div style={{fontSize:'1.4rem'}}>{icon}</div>
                <div style={{fontWeight:900,fontSize:'1.1rem'}}>{title}</div>
                <div style={{fontSize:'0.8rem',opacity:0.8}}>{desc}</div>
              </button>
            );
          })}
        </div>
      </div>
    );
  };

  // LISTENING
  const rListening=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:560,position:'relative',overflow:'hidden',background:'#e1bee7'}}>
      {rFb()}
      <div style={{textAlign:'center',marginBottom:16}}><span style={{background:'#fff',color:'#4a1c40',padding:'6px 20px',borderRadius:99,fontWeight:900}}>題 {idx+1} / {words.length}</span></div>
      <div style={{textAlign:'center',marginBottom:24}}>
        <button onClick={()=>speakW(words[idx].en)} className="candy-btn" style={{background:'#fff',color:'#7e57c2',width:100,height:100,fontSize:'3rem',borderRadius:'50%'}}>🔊</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {opts.map((o,i)=>(
          <button key={i} onClick={()=>{if(!feedback)handleAns(o.en===words[idx].en);}} disabled={!!feedback} className="candy-btn" style={{background:'#fff',color:'#3a1c4a',padding:'18px 8px',fontSize:'1.1rem'}}>
            {o.zh}
          </button>
        ))}
      </div>
    </div>
  );

  // DICTATION / DICTATION-EN
  const rDict=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:520,position:'relative',overflow:'hidden',background:testMode==='dictation'?'#2d2b36':'#f8bbd0'}}>
      {rFb()}
      <div style={{textAlign:'center',marginBottom:16}}><span style={{background:'#fff',color:testMode==='dictation'?'#2d2b36':'#880e4f',padding:'6px 20px',borderRadius:99,fontWeight:900}}>題 {idx+1} / {words.length}</span></div>
      <div style={{textAlign:'center',margin:'20px 0'}}>
        {testMode==='dictation-en' 
          ? <button onClick={()=>speakW(words[idx].en)} className="candy-btn" style={{background:'#fff',color:'#e91e63',width:90,height:90,fontSize:'2.5rem',borderRadius:'50%',marginBottom:16}}>🎧</button>
          : <div style={{fontSize:'3rem',fontWeight:900,color:'#fff'}}>{words[idx]?.zh}</div>}
      </div>
      <form onSubmit={e=>{e.preventDefault();if(!feedback&&inp.trim())handleAns(words[idx].en.toLowerCase()===inp.trim().toLowerCase());}} style={{display:'flex',flexDirection:'column',gap:12}}>
        <input value={inp} onChange={e=>setInp(e.target.value)} disabled={!!feedback} placeholder="輸入英文單字..." className="kawaii-input" autoFocus/>
        <button type="submit" disabled={!!feedback||!inp} className="candy-btn" style={{padding:'16px',background:'#fff',color:testMode==='dictation'?'#2d2b36':'#e91e63',fontSize:'1.1rem'}}>發送魔法 ✓</button>
      </form>
    </div>
  );

  // SPEAKING
  const rSpeaking=()=>(
    <div className="kawaii-card animate-slide-up" style={{padding:32,width:'100%',maxWidth:520,position:'relative',overflow:'hidden',textAlign:'center',background:'#81d4fa'}}>
      {rFb()}
      <div style={{marginBottom:16}}><span style={{background:'#fff',color:'#01579b',padding:'6px 20px',borderRadius:99,fontWeight:900}}>題 {idx+1} / {words.length}</span></div>
      <div style={{fontSize:'3.5rem',fontWeight:900,color:'#01579b',marginBottom:8}}>{words[idx]?.en}</div>
      <div style={{fontSize:'1.2rem',color:'#fff',fontWeight:800,marginBottom:20}}>{words[idx]?.zh}</div>
      <div style={{minHeight:48,marginBottom:16}}>
        {rtText?<span style={{background:'#fff',color:'#0288d1',padding:'8px 24px',borderRadius:99,fontWeight:900}}>"{rtText}"</span>:<span style={{color:'rgba(255,255,255,0.7)'}}>點擊麥克風發音...</span>}
      </div>
      <button onClick={handleSpeak} disabled={!!feedback} className="candy-btn" style={{width:120,height:120,borderRadius:'50%',background:isRec?'#f44336':'#fff',color:isRec?'#fff':'#0288d1',fontSize:'3.5rem',border:'none'}}>🎤</button>
    </div>
  );

  // SENTENCE
  const rSentence=()=>{
    const q=sqList[sqIdx]; if(!q)return null;
    const prog=sqIdx+1,total=sqList.length;
    return(
      <div className="kawaii-card animate-slide-up" style={{padding:28,width:'100%',maxWidth:600,position:'relative',overflow:'hidden',background:'#e1bee7'}}>
        {sqFb&&(<div style={{position:'absolute',inset:0,background:sqFb==='correct'?'#c8e6c9':'#f8bbd0',zIndex:20,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column'}}>
          <div style={{fontSize:'4rem'}}>{sqFb==='correct'?'🎉':'😿'}</div>
          <div style={{fontSize:'1.5rem',fontWeight:900,color:sqFb==='correct'?'#2e7d32':'#880e4f'}}>{sqFb==='correct'?'答對了！':'再試試看！'}</div>
        </div>)}
        <div style={{background:'#fff',borderRadius:99,padding:'6px 16px',color:'#673ab7',fontWeight:900,display:'inline-block',marginBottom:16}}>第 {prog} / {total} 題</div>
        <div style={{background:'#fff',borderRadius:20,padding:'16px',marginBottom:20,textAlign:'center'}}>
          <div style={{fontSize:'1.2rem',fontWeight:900,color:'#311b92'}}>{q.translation}</div>
        </div>
        
        {q.type==='fill_blank'&&(
          <form onSubmit={e=>{e.preventDefault();if(!sqFb&&fillInp.trim())sqNext(fillInp.trim().toLowerCase()===q.blank_word.toLowerCase());}}>
            <div style={{fontSize:'1.4rem',fontWeight:900,color:'#311b92',textAlign:'center',marginBottom:16}}>{q.sentence}</div>
            <input value={fillInp} onChange={e=>setFillInp(e.target.value)} disabled={!!sqFb} placeholder="填入單字..." className="kawaii-input" autoFocus style={{marginBottom:12}}/>
            <button type="submit" disabled={!!sqFb||!fillInp} className="candy-btn" style={{width:'100%',padding:'16px',background:'#311b92',color:'#fff',fontSize:'1.1rem'}}>送出 ✓</button>
          </form>
        )}
        
        {q.type==='choice'&&(
          <div>
            <div style={{fontSize:'1.4rem',fontWeight:900,color:'#311b92',textAlign:'center',marginBottom:20}}>{q.sentence}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              {q.options_template.map((o,i)=>(
                <button key={i} onClick={()=>{if(!sqFb)sqNext(o===q.answer);}} disabled={!!sqFb} className="candy-btn" style={{background:'#fff',color:'#311b92',padding:'16px 8px',fontSize:'1.1rem'}}>{o}</button>
              ))}
            </div>
          </div>
        )}

        {q.type==='arrange'&&(
          <div>
            <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();if(window.dragW) { setArrWords(p=>p.filter(x=>x!==window.dragW)); setArrAns(p=>[...p,window.dragW]); }}}
              style={{minHeight:60,background:'#fff',borderRadius:16,padding:'12px',marginBottom:12,display:'flex',flexWrap:'wrap',gap:8}}>
              {arrAns.map((w,i)=><span key={i} onClick={()=>{setArrAns(p=>p.filter(x=>x!==w));setArrWords(p=>[...p,w]);}} style={{background:'#311b92',color:'#fff',padding:'8px 16px',borderRadius:12,fontWeight:900,cursor:'pointer'}}>{w}</span>)}
            </div>
            <div style={{minHeight:60,background:'rgba(255,255,255,0.5)',borderRadius:16,padding:'12px',marginBottom:16,display:'flex',flexWrap:'wrap',gap:8}}>
              {arrWords.map((w,i)=><span key={i} draggable onDragStart={()=>window.dragW=w} onClick={()=>{setArrWords(p=>p.filter(x=>x!==w));setArrAns(p=>[...p,w]);}} style={{background:'#fff',color:'#311b92',padding:'8px 16px',borderRadius:12,fontWeight:900,cursor:'pointer',boxShadow:'0 2px 0 rgba(0,0,0,0.1)'}}>{w}</span>)}
            </div>
            <button onClick={()=>{if(!sqFb&&arrAns.length)sqNext(arrAns.join(' ').trim().toLowerCase()===q.answer.trim().toLowerCase());}} disabled={!!sqFb||!arrAns.length} className="candy-btn" style={{width:'100%',padding:'16px',background:'#311b92',color:'#fff',fontSize:'1.1rem'}}>確認順序 ✓</button>
          </div>
        )}
      </div>
    );
  };

  // RESULT
  const rResult=()=>(
    <div className="kawaii-card animate-bounce-in" style={{padding:40,maxWidth:460,width:'100%',textAlign:'center',background:'#fff9c4'}}>
      <div className="animate-float" style={{marginBottom:16}}>{Characters.pinkie(120)}</div>
      <h2 style={{fontSize:'2.5rem',fontWeight:900,color:'#f57f17',marginBottom:8}}>測驗完成！</h2>
      <p style={{fontSize:'1.5rem',fontWeight:900,color:'#ffb300',marginBottom:24}}>答對 <span style={{fontSize:'2.5rem',color:'#e65100'}}>{fpCorrect}</span> / {initCount}</p>
      <button className="candy-btn" onClick={()=>setSt('menu')} style={{padding:'16px',width:'100%',background:'#f57f17',color:'#fff',fontSize:'1.2rem'}}>← 返回選單</button>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',padding:'20px 16px',display:'flex',flexDirection:'column',alignItems:'center',position:'relative',overflow:'hidden'}}>
      {/* 漂浮裝飾 */}
      {['⭐','🎀','✨','🦄','💖'].map((s,i)=>(<div key={i} style={{position:'fixed',top:`${15+i*15}%`,left:i%2===0?'5%':'90%',fontSize:`${1.5+i*0.2}rem`,opacity:0.4,animation:`float ${3+i}s ease-in-out infinite`}}>{s}</div>))}
      
      {showConfetti&&<Confetti/>}
      {charPopup&&<CharacterPopup mode={charPopup} onClose={()=>setCharPopup(null)}/>}
      
      {notif && <div style={{position:'fixed',top:16,background:'#2d2b36',color:'#fff',padding:'12px 24px',borderRadius:99,fontWeight:900,zIndex:100}}>{notif}</div>}

      <div style={{width:'100%',maxWidth:1000,flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24,zIndex:10}}>
        {['listening','dictation','dictation-en','speaking','sentence'].includes(st)&&rGameHdr('魔法測驗', '#fff', '#2d2b36')}
        {st==='setup'&&rSetup()}
        {st==='calendar'&&rCal()}
        {st==='review'&&rReview()}
        {st==='menu'&&rMenu()}
        {st==='story'&&<StoryReader wordsPool={wordsPool} onBack={()=>setSt('menu')}/>}
        {st==='listening'&&rListening()}
        {(st==='dictation'||st==='dictation-en')&&rDict()}
        {st==='speaking'&&rSpeaking()}
        {st==='sentence'&&rSentence()}
        {st==='result'&&rResult()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
